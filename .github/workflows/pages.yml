# Выкладка на GitHub Pages: на каждый push в основную ветку собирает dist/ и публикует.
# Адрес: https://g-k-one.github.io/pawn2/
# Один раз включить вручную: Settings → Pages → Source: GitHub Actions (робот GitHub включить Pages сам не может).
name: pages
on:
  push:
    branches: [claude/zen-turing-dr0uw4, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
