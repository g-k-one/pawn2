<body>
<div class="stage" id="stage">
  <div class="scene" id="scene">

  <!-- лента лайв -->
  <div class="abs sheet">
    <div class="abs live-tag"><span class="up" data-t>лайв</span></div>
    <div class="abs live"><div class="live-row" id="live"></div></div>
  </div>

  <!-- панель крафта -->
  <div class="abs panel" id="panel">
    <canvas id="glow"></canvas>
    <div class="abs tiers" id="tiers"></div>
    <div class="abs range" id="range">x0.4 — x0.8</div>
  </div>

  <div class="abs chance" id="chance"><small data-t>шанс</small><b id="chanceVal">27%</b></div>

  <!-- приз -->
  <div class="abs prize empty" id="prize">???</div>
  <div class="abs drops" id="drops"></div>
  <!-- гифты, которые кладутся в крафт -->
  <div class="abs" id="slots" style="inset:0;pointer-events:none"></div>

  <!-- ставка -->
  <div class="abs bet" id="bet"></div>

  <!-- нижняя панель -->
  <div class="abs bar">
    <button class="round" id="giftBtn" aria-label="Добавить гифты"><img id="giftIco" src="assets/gift-add.svg" alt=""><span class="cnt" id="giftCnt" hidden></span></button>
    <div class="chips">
      <button class="pill trash" id="trash" aria-label="Сбросить ставку"><img src="assets/trash.svg" width="21" height="24" alt=""></button>
      <button class="pill" data-add="0.1"><b>+0.1</b></button>
      <button class="pill" data-add="0.5"><b>+0.5</b></button>
      <button class="pill" data-add="1"><b>+1</b></button>
      <button class="pill" data-add="5"><b>+5</b></button>
    </div>
    <button class="round" id="menuBtn" aria-label="Меню"><svg class="menu-ico" viewBox="0 0 20 16" aria-hidden="true"><path d="M2 2h16M2 8h16M2 14h16" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></button>
  </div>

  <!-- крафт -->
  <button class="abs craft" id="craft" aria-label="Скрафтить">
    <span class="cb" id="cb">
      <img class="orb" src="assets/orb.webp" alt="">
      <span class="core"></span>
      <img class="anvil" id="anvil" src="assets/anvil.svg" alt="">
      <span class="hammer" id="hammer"><img src="assets/hammer.svg" alt=""></span>
      <span class="glint"></span>
    </span>
  </button>


  <div class="abs flash" id="flash"></div>


  </div>

  <!-- экран крафта -->
  <section class="fx" id="fx" aria-live="polite">
    <canvas id="fxGlow"></canvas>
    <div class="fx-in" id="fxIn">
      <div class="fx-top" id="fxTop">
      <div class="digits" id="digits"><span><u class="win"><i></i></u></span><span><u class="win"><i></i></u></span><span><u class="win"><i></i></u></span><span><u class="win"><i></i></u></span><span><u class="win"><i></i></u></span></div>
      <div class="fx-tier" id="fxTier">&nbsp;</div>
      <div class="ladder" id="ladder"></div>
      <div class="fx-need" id="fxNeed"></div>
      <div class="fx-pvp" id="fxPvp"></div>
      </div>
      <div class="fx-case" id="fxCase"><div class="fxc-art" id="fxCaseArt"></div><h4 id="fxCaseT"></h4><div class="croul"><div class="rstrip" id="fxStrip"></div><i class="mline"></i></div><p id="fxCaseS"></p></div>
      <div class="fx-drop" id="fxDrop"></div>
      <div class="fx-win" id="fxWin"></div>
      <div class="fx-btns" id="fxBtns"></div>
      <div class="fx-arena" id="fxArena"></div>
      <div class="fx-bets" id="fxBets"></div>
    </div>
  </section>

    <div class="fx-intro" id="fxIntro" aria-hidden="true"><img class="fi-orb" src="assets/orb.webp" alt=""><span class="fi-heat"></span><span class="fi-ring"></span><img class="fi-a" src="assets/anvil.svg" alt=""><span class="fi-h"><img src="assets/hammer.svg" alt=""></span></div>
  <!-- шторки -->
  <div class="backdrop" id="backdrop"></div>

    <div class="dr-b"><div class="inv" id="inv"></div></div>

  </section>

    <div class="dr-b" id="dbgBody"></div>

(()=>{const la=(()=>{try{return localStorage.getItem("bm-lang")==="en"?"en":"ru"}catch{return"ru"}})(),ms={"Внизу — режимы. На Арене до 6 игроков загадывают тикет колесом: кто ближе всех к выпавшему — крафтит на весь банк.":"Modes are at the bottom. In the Arena up to 6 players pick a ticket with the wheel: whoever is closest to the drawn one crafts the whole pot.","Дождись боя — после него можно в другой режим":"Wait for the battle — then you can switch modes","Ключ комнаты + отпечаток тикетов всех игроков (в порядке входа) по открытой формуле дают тикет {0}. Тикеты зафиксированы до розыгрыша — подогнать его ни под кого нельзя.":"The room key + the fingerprint of all players' tickets (in join order) give ticket {0} by the open formula. Tickets are locked before the draw — it can't be rigged for anyone.",Финансы:"Finance","Комиссия за вывод":"Withdrawal fee","Ставка не прошла":"The bet didn't go through","Честность в каждом режиме":"Fairness in every mode","Тикет — от зерна эпохи и твоего ключа. Ранг и множитель — по диапазону тикета.":"The ticket comes from the epoch seed and your key. Rank and multiplier follow the ticket range.","У комнаты своё зерно, хеш виден до взносов. Тикет считается от зерна и списка всех тикетов игроков — подогнать его нельзя.":"Each room has its own seed, its hash is shown before entries. The ticket is computed from the seed and the list of all players' tickets — it can't be rigged.","Тикет — от зерна эпохи и твоего ключа, как в крафте. Каждая ставка сыграла или нет по правилу своего вида.":"The ticket comes from the epoch seed and your key, as in crafts. Each bet wins or not by the rule of its type.","Тикет — от зерна эпохи. Предмет — по диапазонам шансов кейса, они открыты в описании.":"The ticket comes from the epoch seed. The item follows the case's chance ranges, shown in its description.","День недели":"Week day","Выиграно в играх":"Won in games",Боёв:"Battles",Побед:"Wins",Взносы:"Entries",Ставок:"Bets",Сбылось:"Came true",Ставки:"Bets","Эксперименты: ставки":"Experiments: bets",Игры:"Games","Ставок пока нет":"No bets yet","Активность друзей":"Friends' activity","Депозит друга":"Friend's deposit","первый депозит":"first deposit","Ставки — только на GRAM":"Bets are GRAM only","Правила ставок":"Bet rules","Загадай тикет":"Pick a ticket","Крути колесо — от 00000 до 99999. Один тикет — один игрок.":"Spin the wheel — from 00000 to 99999. One ticket per player.","Зайди в комнату":"Join the room","Взнос у всех одинаковый. Таймер 30 секунд идёт с первого игрока.":"Everyone pays the same entry. The 30-second timer starts with the first player.","Ближе всех — крафтит банк":"Closest crafts the pot","Весь банк уходит в крафт с выпавшим тикетом, множитель — по его рангу. Один в комнате — крафт твой.":"The whole pot is crafted with the drawn ticket, the multiplier follows its rank. Alone in the room — the craft is yours.","Ничья — пополам":"Tie — split in half","Двое одинаково близко, выше и ниже тикета: каждый крафтит свою половину.":"Two equally close, above and below the ticket: each crafts their half.","За 5 секунд — стоп":"5 seconds — stop","Тикеты фиксируются, войти или сменить тикет уже нельзя.":"Tickets lock — you can't join or change your ticket anymore.","Хеш зерна комнаты известен до взносов. После старта зерно раскроется — исход можно проверить.":"The room seed hash is known before entries. After the start the seed is revealed — the outcome can be verified.",Взнос:"Entry",Дальше:"Next",Игроки:"Players","Крути колесо и угадай тикет — самый близкий крафтит на весь банк":"Spin the wheel and guess the ticket — the closest crafts the whole pot",ничья:"tie","Арена — только на GRAM":"Arena is GRAM only","Боёв на арене пока нет":"No arena battles yet","Ты на арене":"You're in the arena","Ничья · доля банка {0} GRAM":"Tie · pot share {0} GRAM","Все слоты заняты":"All slots taken","Арена заполнена":"The arena is full","Крафт на банк {0} GRAM":"Crafted the pot {0} GRAM","Следующая откроется сразу после старта":"The next one opens right after the start",Арена:"Arena","Общий банк":"Total pot",эксперимент:"experiment","Включён — пункт в меню":"On — shown in menu",Ты:"You",Случайный:"Random","Этот тикет уже занят":"This ticket is taken",сдвиг:"offset",Диагностика:"Diagnostics",Сборка:"Build",сцена:"stage","Восстановление — только на GRAM":"Restoring a day is GRAM-only","Сделай ставку":"Place a bet","Добро пожаловать в Pawn":"Welcome to Pawn","Ставишь GRAM или NFT-подарок, бьёшь по наковальне — и получаешь приз одного из пяти рангов, от «Базы» до «Джекпота». Покажу за полминуты.":"Stake GRAM or an NFT gift, strike the anvil — and get a prize from one of five ranks, from Base to Jackpot. Let me show you in 30 seconds.",Поехали:"Let's go","Нажми на любой ранг — увидишь, что можно выбить и с каким шансом. Потом можно и свайпать по экрану.":"Tap any rank to see what you can win and the odds. Later you can swipe across the screen too.","Отлично! Приз и шанс поменялись":"Nice! The prize and odds changed","Добавь GRAM кнопкой, например +1. Ставка растёт — растёт и приз. Корзина слева всё сбросит.":"Add GRAM with a button, say +1. A bigger stake means a bigger prize. The bin on the left resets it.","Ставка есть — смотри, приз вырос":"Stake placed — look, the prize grew","Здесь бонусы и кейсы, история игр и проверка честности":"Bonuses and cases, game history and fairness checks live here","Жми на наковальню — и узнаешь приз. Каждый исход можно проверить после игры. Хочешь сначала попробовать без риска?":"Tap the anvil to get your prize. Every outcome can be verified after the game. Want to try risk-free first?","Играть на GRAM":"Play for GRAM","На фантиках":"Try with candies","1 из 100 000":"1 in 100,000","5% от активности":"5% of activity","5% от активности сами зачисляются на баланс каждый день в 00:00 МСК — забирать вручную не нужно.":"5% of activity is credited automatically every day at 00:00 MSK — no need to claim it.","Client seed — твой ключ":"Client seed — your key","Commitment · игр в эпохе:":"Commitment · games in epoch:","Commitment — SHA-256 зерна, показан до игры":"Commitment — SHA-256 of the seed, shown before the game","GRAM в ставке уменьшены":"GRAM in the bet reduced","GRAM вернулись на баланс":"GRAM returned to the balance","NFT выведено":"NFTs withdrawn","NFT забран":"NFT taken","NFT на главной при смене ставки":"NFT on the main screen when the bet changes","NFT на плитке — для примера":"The NFT on the tile is just an example","NFT продан":"NFT sold","Nonce · домен · блок":"Nonce · domain · block","SHA-256(server seed) должен совпасть с отпечатком, показанным до игры":"SHA-256(server seed) must match the fingerprint shown before the game","Server seed — секретное зерно сервера":"Server seed — the secret server seed","Super Drop забирает тот, кто первым выбьет загаданный тикет.":"The Super Drop goes to whoever hits the target ticket first.","TON Connect не загрузился":"TON Connect failed to load","XP · максимум":"XP · max","XP дают за задания, достижения и в кейсах.":"XP comes from tasks, achievements and cases.","Адрес для пополнений не задан":"Deposit address is not set","Активность — это разница пополнений друга (GRAM и NFT) и выведенного.":"Activity is the difference between a friend's top-ups (GRAM and NFT) and withdrawals.",База:"Base",Базы:"Base",Барон:"Baron","Без свечения и анимаций, крафт сразу показывает итог":"No glow or animations, craft shows the result instantly","Без сообщения релееру вывод не пройдёт. NFT остались у тебя, комиссия не списана":"Withdrawals don't go through without a message to the relayer. Your NFTs stay with you and no fee was charged","Без условий":"No conditions","Белая черта — честный шанс ранга. Чем больше крафтов, тем ближе к ней твои доли.":"The white line is the fair chance of each rank. The more you craft, the closer your shares get to it.",Бесплатно:"Free",Бист:"Beast","Бонус за друзей":"Referral bonus","Бонус с первого депозита друга — 10%, максимум 0.5 GRAM за каждого.":"Bonus from a friend's first deposit — 10%, up to 0.5 GRAM per friend.",Бонусы:"Bonuses","Быстрый крафт":"Fast craft","В Telegram откроется бот партнёра":"The partner bot will open in Telegram","В демо баланс бесконечный":"Balance is unlimited in demo","В демо не разыгрывается":"Not played in demo","В крафте":"In craft","В расчёте участвует и твой ключ. Его можно сменить в любой момент — поэтому мы не можем заранее подобрать результат под тебя.":"Your key is part of the calculation. You can change it any time, so we can't tailor the result to you in advance.","В реальном режиме он был бы твоим":"In real mode it would be yours",ВС:"SU",ВТ:"TU",Вернуться:"Back",Вибрация:"Vibration","Включить экономный режим без анимаций?":"Turn on lite mode without animations?","Восстановление дня":"Day restore","Все награды из кейсов — GRAM, XP и NFT — зачисляются сразу.":"All case rewards — GRAM, XP and NFT — are credited instantly.","Вставь JSON на сайте проверки":"Paste the JSON on the verification site","Вся история":"Full history","Всё честно ✓":"All fair ✓","Выбей его первым в крафте — и NFT твой":"Hit it first in a craft and the NFT is yours","Выбери подарки":"Pick gifts","Выбери подарки для вывода":"Pick gifts to withdraw","Выбить супер дроп · тикет":"Hit super drop · ticket",Вывести:"Withdraw","Вывести NFT":"Withdraw NFT","Вывод NFT":"Withdraw NFT","Вывод NFT не прошёл":"NFT withdrawal failed","Вывод: не написал релееру":"Withdraw: no relayer message",Выиграно:"Won",Выигрыш:"Win",Выключен:"Off","Выключи демо в меню":"Turn off demo in the menu","Выключи демо в меню, чтобы крафтить из NFT":"Turn off demo in the menu to craft with NFTs",Выпало:"Dropped","Выполни все 3 — откроется кейс Мистера Биста":"Complete all 3 to unlock MrBeast's case","Выполняй задания дня всю неделю":"Complete daily tasks all week","Где в ранге":"Where in the rank",Готово:"Done",Да:"Yes",Далее:"Next",Дебаг:"Debug","Дебаг выключен":"Debug off","Дебаг:":"Debug:","Дебаг: вывод без сообщения релееру":"Debug: withdrawal without a relayer message","Дебаг: исход выбран в настройках, ключ сервера подобран перебором — проверка сходится.":"Debug: the outcome was forced and the server key brute-forced — the check still passes.","Дебаг: следующий вывод NFT не пройдёт":"Debug: the next NFT withdrawal will fail","Дебаг: следующий кейс не откроется":"Debug: the next case won't open","Дебаг: следующий крафт не удастся":"Debug: the next craft will fail","Дебаг: супер дроп":"Debug: super drop","Дебаг: тикет задан вручную, поэтому проверка не сойдётся. Это нормально.":"Debug: the ticket was set manually, so the check won't match. That's expected.","Демо выключено":"Demo off","Демо-режим":"Demo mode","День восстановлен":"Day restored","Депозит NFT":"NFT deposits",Джекпот:"Jackpot",Джекпота:"Jackpot","Для ранга подбирается настоящий server seed — проверка честности сходится, но хеш до игры будет другим. Точный тикет подставляется напрямую, проверка для него не сойдётся. Только для тестов прототипа.":"For a rank, a real server seed is brute-forced — the check passes, but the pre-game hash will differ. An exact ticket is injected directly and won't verify. Prototype testing only.","До игры":"Before the game","До игры мы показали «отпечаток» секретного ключа сервера. Теперь ключ открыт — сверим, что отпечаток тот же.":"Before the game we showed a fingerprint of the server's secret key. Now the key is revealed — let's check the fingerprint matches.","Добавь GRAM или подарки кнопками внизу":"Add GRAM or gifts with the buttons below","Добавь фантики кнопками внизу":"Add candies with the buttons below",Доказательство:"Proof",Достижение:"Achievement","Достижение получено":"Achievement unlocked",Достижения:"Achievements",Другое:"Other","Друзей:":"Friends:","Если у тебя ещё нет пригласившего и ты не пополнял баланс — по ссылке друга ты закрепишься за ним.":"If you have no referrer yet and haven't topped up, a friend's link makes you their referral.","Ещё 1 XP за каждые 2 GRAM оборота — суммы ставок.":
