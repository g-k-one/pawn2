<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Black Market Craft</title>
<script>/* SDK Telegram грузим только внутри Telegram */if (/tgWebApp/.test(location.hash + location.search) || window.TelegramWebviewProxy) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');</script>
<style>
/* Прототип экрана крафта «Black Market».
   Макет 390×844 масштабируется под экран целиком.
   Шрифт SONGER Condensed лежит в assets/fonts, всё работает офлайн.
   Рамка панели — WebGL-свечение (цвет тира меняется в реальном времени), без WebGL — CSS-тень. */
@font-face{font-family:"SONGER";src:url(assets/fonts/songer-regular.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"SONGER";src:url(assets/fonts/songer-bold.woff2) format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"SONGER";src:url(assets/fonts/songer-extrabold.woff2) format("woff2");font-weight:800;font-display:block}
:root{
  --font:"SONGER","Arial Narrow",system-ui,sans-serif;
  --tier:#12d53d; --tierA:#12d53d; --tierB:#00a186;
  --chip:rgba(255,255,255,.1); --teal:#00d9ff; --blue:#30a5ff;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0b}
body{font-family:var(--font);color:#fff;-webkit-user-select:none;user-select:none;display:grid;justify-items:center;align-items:start}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
img{display:block;-webkit-user-drag:none}

/* сцена 390×844, масштаб задаёт JS */
.stage{position:relative;width:390px;height:844px;flex:none;transform-origin:50% 0;overflow:hidden;overflow:clip;background:#0b0b0b}
/* всё, кроме баланса, прижато к низу экрана: на высоких телефонах лишнее место уходит наверх, на коротких — сжимается зазор над лентой */
.scene{position:absolute;left:0;bottom:0;width:100%;height:844px}
.abs{position:absolute}
.cx{left:50%;transform:translateX(-50%)}
.up{text-transform:uppercase;line-height:normal;white-space:nowrap}

/* ---------- баланс ---------- */
.balance{top:var(--balTop,43px);z-index:5;display:flex;align-items:center}
.balance .ava{width:40px;height:40px;margin-right:-4px;position:relative;z-index:1}
.pill{display:flex;align-items:center;justify-content:center;gap:4px;min-width:38px;padding:2px 8px;border-radius:999px;background:var(--chip);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.pill b{font-weight:700;font-size:25.565px;line-height:34px}
.balance .pill b{color:var(--blue);font-variant-numeric:tabular-nums}

/* ---------- лента «лайв» ---------- */
.sheet{left:0;bottom:-15px;width:100%;height:757px;border-radius:24px 24px 0 0;overflow:hidden;background:linear-gradient(#1f1f21,#000 32.83%)}
.live-tag{left:9px;top:9px}
.live-tag span{position:relative;display:block;writing-mode:vertical-rl;transform:rotate(180deg);width:24px;padding:12px 0 22px;border-radius:999px;background:var(--chip);color:rgba(255,255,255,.55);
  font-weight:700;font-size:20px;line-height:24px;text-align:center}
.live-tag span::before{content:"";position:absolute;left:50%;bottom:9px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#ff4c35;box-shadow:0 0 6px #ff4c35;animation:livePulse 1.6s ease-in-out infinite}
@keyframes livePulse{50%{opacity:.25}}
.live{left:38px;right:0;top:8px;height:66px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
.live-row{display:flex;gap:6px;height:66px;padding-left:2px;will-change:transform}
/* карточка дропа: цвет редкости снизу, приз, сумма выигрыша */
.item{position:relative;width:56px;height:64px;flex:none;border-radius:15px;overflow:hidden;cursor:pointer;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 7%,#151517) 15%,color-mix(in srgb,var(--c) 36%,#151517));box-shadow:inset 0 0 22px color-mix(in srgb,var(--c) 26%,transparent),inset 0 1px 0 rgba(255,255,255,.06)}
.item::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--c);box-shadow:0 0 10px 1px var(--c)}
.item .glow{position:absolute;left:50%;top:22px;width:50px;height:50px;margin:-25px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 50%,transparent),transparent);opacity:.8}
.item img{position:absolute;left:9px;top:3px;width:38px;height:38px;object-fit:contain}
.item i{position:absolute;left:0;right:0;bottom:8px;display:flex;align-items:center;justify-content:center;gap:2px;font-style:normal;font-size:14px;line-height:16px;font-weight:700;color:#fff;white-space:nowrap}
.item i img{position:static;width:10px;height:auto}
.item.me{box-shadow:inset 0 0 0 1.5px #fff,inset 0 1px 0 rgba(255,255,255,.06)}
/* ультра и джекпот: по карточке пробегает блик */
.item.hi .shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{55%,100%{transform:translateX(120%)}}

/* ---------- панель крафта ---------- */
.panel{left:0;bottom:0;width:100%;height:659px;border-radius:64px 64px 0 0;overflow:hidden;background:#050806}
.panel canvas{position:absolute;inset:0;width:100%;height:100%}
.nogl .panel{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tier) 40%,transparent)}
.nogl .panel::before{content:"";position:absolute;inset:15px 16px 20px;border-radius:48px;animation:breathe 7s ease-in-out infinite;
  box-shadow:inset 0 0 30px 4px color-mix(in srgb,var(--tier) 70%,transparent),0 0 30px color-mix(in srgb,var(--tier) 40%,transparent);transition:box-shadow .3s}
.tiers{top:56px;left:calc(50% - .5px);transform:translateX(-50%);display:flex;gap:16px;align-items:flex-end}
.tier{font-weight:700;font-size:20px;text-transform:uppercase;line-height:26px;opacity:.5;transition:opacity .25s,transform .25s;min-width:46px;text-align:center;color:var(--c)}
.tier.on{opacity:1;transform:scale(1.08)}
.tind{position:absolute;left:0;bottom:-8px;width:40px;height:3px;border-radius:2px;background:var(--tier);box-shadow:0 0 10px var(--tier);pointer-events:none;
  transition:transform .5s cubic-bezier(.3,1.25,.4,1),width .5s cubic-bezier(.3,1.25,.4,1),background .3s,box-shadow .3s}
.scene{touch-action:none}
/* смена ранга: старый приз растворяется «вглубь», новый проявляется из глубины — без сдвига вбок */
.drop.sl{animation:depthIn .55s cubic-bezier(.2,.8,.25,1) both;animation-delay:var(--dl,0s)}
.drop.sl.out{animation:depthOut .26s cubic-bezier(.4,0,.8,.5) both}
@keyframes depthIn{from{opacity:0;scale:var(--z0,.82);filter:blur(6px)}to{opacity:1;scale:1;filter:blur(0)}}
@keyframes depthOut{to{opacity:0;scale:var(--z1,1.14);filter:blur(6px)}}
.chance{top:200px;z-index:4;display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;white-space:nowrap;
  background:linear-gradient(150deg,var(--tierA),var(--tierB));transition:left .35s cubic-bezier(.3,1.3,.5,1),background .3s;transform:translateX(-50%)}
.chance small{font-weight:700;font-size:14px;line-height:19px;color:#000;text-transform:uppercase}
.chance b{font-weight:400;font-size:20px;line-height:25px;font-variant-numeric:tabular-nums}
.range{overflow:visible;top:124px;left:50%;transform:translate(-50%,-50%);font-weight:700;font-size:64px;line-height:normal;white-space:nowrap;text-transform:uppercase;
  background:linear-gradient(#fff 22.1%,var(--tier));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- приз ---------- */
.prize{top:408px;left:50%;transform:translate(-50%,-50%);font-weight:700;font-variant-numeric:tabular-nums;font-size:162.885px;line-height:normal;white-space:nowrap;text-transform:uppercase;
  -webkit-background-clip:text;background-clip:text;color:transparent;transition:opacity .3s}
.prize.ton{background-image:linear-gradient(#00d9ff 19.47%,rgba(0,51,179,0))}
.prize.nft,.prize.empty{background-image:linear-gradient(#fff 19.47%,rgba(0,0,0,0))}
.prize.empty{opacity:.55}
.prize.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{scale:.85}60%{scale:1.06}100%{scale:1}}

/* что может выпасть: внешний слой — появление с отскоком, внутренний — лёгкое покачивание */
.drops{left:calc(50% - 195px);top:0;width:390px;height:844px;pointer-events:none;isolation:isolate;transform:translateZ(0)}
.drop{position:absolute;animation:bounceIn .7s cubic-bezier(.25,1.4,.45,1) both;animation-delay:var(--dl,0s)}
.drop.out{animation:dropOut .25s ease-in both}
.drop .sway{width:100%;height:100%;animation:sway var(--sw,4s) ease-in-out infinite;animation-delay:var(--sd,0s)}
.drop img{width:100%;height:100%;object-fit:contain}
.drop .tag{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;padding:1px 8px;border-radius:999px;
  background:rgba(0,0,0,.62);font-weight:700;font-size:16px;line-height:22px;white-space:nowrap}
.drop .tag img{width:15px;height:13px}
@keyframes bounceIn{0%{opacity:0;transform:translateY(46px) scale(.3)}55%{opacity:1;transform:translateY(-10px) scale(1.08)}75%{transform:translateY(3px) scale(.97)}100%{opacity:1;transform:none}}
@keyframes dropOut{to{opacity:0;transform:translateY(20px) scale(.6)}}
@keyframes sway{0%,100%{transform:translateY(0) rotate(var(--r0,-4deg))}50%{transform:translateY(-9px) rotate(var(--r1,4deg))}}
/* ---------- NFT-карточка (из инвентаря): фон, картинка и блик — отдельные слои для параллакса ---------- */
.nc{--w:96px;position:relative;width:var(--w);height:var(--w);flex:none}
.nc-t{position:absolute;inset:0;border-radius:16%;overflow:hidden;isolation:isolate;will-change:transform;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.nc-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,var(--a) 0%,var(--b) 78%)}
.nc-pat{position:absolute;inset:-5%;opacity:.42;background:var(--p);will-change:transform;
  -webkit-mask:var(--pat) center/100% 100% no-repeat;mask:var(--pat) center/100% 100% no-repeat}
.nc-img{position:absolute;left:12%;top:12%;width:76%;height:76%;object-fit:contain;will-change:transform;filter:drop-shadow(0 calc(var(--w) * .03) calc(var(--w) * .04) rgba(0,0,0,.28))}
/* мягкий световой блик: едет по карточке при повороте */
.nc-gl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.nc-gl i,.drop .gl i,.fx-drop .gl i{position:absolute;left:-50%;top:-50%;width:200%;height:200%;will-change:transform;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.3),rgba(255,255,255,.11) 20%,rgba(255,255,255,.03) 34%,transparent 46%)}
/* уголок с номером, как у коллекционных подарков */
.nc-rb{position:absolute;top:0;right:0;width:52%;height:52%;overflow:hidden;pointer-events:none}
.nc-rb span{position:absolute;top:22%;right:-34%;width:120%;transform:rotate(45deg);text-align:center;background:color-mix(in srgb,var(--b) 72%,#000);
  font-weight:700;font-size:calc(var(--w) * .095);line-height:1.55;letter-spacing:.02em;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.nc-price{display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:17px;line-height:22px;margin-top:6px}
.nc-price img{width:17px;height:auto}
.nc-p img{width:1em;height:auto}

/* ---------- гифты, положенные в крафт ---------- */
.slot{position:absolute;width:96px;height:96px;z-index:2;cursor:pointer}
.slot-0{left:calc(50% - 142px);top:548px;transform:rotate(-10deg) scale(.8)}
.slot-1{left:calc(50% + 46px);top:542px;transform:rotate(10deg) scale(.84)}
.slot .chip{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);display:flex;align-items:center;gap:3px;padding:0 8px;border-radius:99px;background:rgba(0,0,0,.66);font-weight:700;font-size:15px;line-height:22px;white-space:nowrap}
.slot .chip img{width:15px}
.slot .in{width:100%;height:100%;animation:bounceIn .7s cubic-bezier(.25,1.4,.45,1) both}
.slot .sw{width:100%;height:100%;animation:sway 3.8s ease-in-out infinite;--r0:-4deg;--r1:3deg}
.slot-1 .sw{animation-duration:4.4s;animation-delay:-1.4s;--r0:3deg;--r1:-4deg}
.slot.out{pointer-events:none}
.slot.out .in{animation:dropOut .25s ease-in both}

/* ---------- приз: наклон и блик по форме картинки ---------- */
.drop .tw{width:100%;height:100%;position:relative;will-change:transform}
.drop .gl{position:absolute;inset:0;pointer-events:none;overflow:hidden;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;}

/* ---------- шторки ---------- */
/* ---------- экран крафта ---------- */
.fx{position:absolute;inset:0;z-index:45;background:#000;opacity:0;pointer-events:none;transition:opacity .22s ease-out}
#glow{transition:opacity .16s}
.glowoff #glow{opacity:0}
.fx.on{opacity:1;pointer-events:auto}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
/* заставка перед прокрутом: крупные силуэты молота и наковальни с подсветкой по контуру */
.fx-intro{position:absolute;z-index:46;left:50%;top:50%;width:258px;height:258px;margin:-150px 0 0 -129px;pointer-events:none;opacity:0;--ic:#b9a6ff}
.fx-intro .fi-a{position:absolute;left:63px;top:129px;width:132px;height:64.8px;transform-origin:50% 100%}
.fx-intro .fi-h{position:absolute;left:102px;top:55px;width:108px;height:67px;transform-origin:97% 12%;rotate:14deg}
.fx-intro .fi-h img{display:block;width:100%;height:100%}
.fx-intro .fi-a,.fx-intro .fi-h img{filter:brightness(0) drop-shadow(0 0 1.5px var(--ic)) drop-shadow(0 0 16px color-mix(in srgb,var(--ic) 65%,transparent))}
.fi-sp{position:absolute;left:141px;top:129px;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px var(--ic);pointer-events:none}
.fx-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.fx-top{display:flex;flex-direction:column;align-items:center;width:100%}
.fx-in>*,.fx-top>*{flex-shrink:0}
.digits{display:flex;gap:6px;transform:scale(calc(var(--ds,1) * var(--dz,1)));transition:transform .5s cubic-bezier(.3,1.1,.4,1),margin .7s cubic-bezier(.3,1.2,.5,1)}
.digits span{position:relative;flex:none;display:block;width:62px;height:96px;min-height:96px;overflow:hidden;border-radius:16px;-webkit-clip-path:inset(0 round 16px);clip-path:inset(0 round 16px);
  transform:translateZ(0);background:rgba(255,255,255,.05);font-weight:700;font-size:84px;line-height:1;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums;transition:color .35s,background .35s,box-shadow .5s}
/* затемнение сверху и снизу — цифры «выезжают» из глубины барабана, без жёсткого среза */
.digits span::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.82))}
.digits span .win{position:absolute;inset:0;display:block;text-decoration:none}
.digits span.blur i{filter:blur(2px)}
.digits.focus span:first-child{transform:translateZ(0) scale(1.1);box-shadow:inset 0 0 0 1.5px var(--tc),0 0 24px color-mix(in srgb,var(--tc) 45%,transparent)}
.digits span:first-child{transition:color .35s,background .35s,box-shadow .4s,transform .45s cubic-bezier(.3,1.4,.5,1)}
.digits.run span{color:color-mix(in srgb,var(--tc) 55%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc) 30%,transparent)}
.digits span i{position:absolute;left:0;top:0;width:100%;display:block;font-style:normal}
.digits span i b{display:block;height:96px;line-height:96px;text-align:center;font-weight:700}
.digits span.lock{color:#fff;background:rgba(255,255,255,.12);animation:lockPop .5s cubic-bezier(.3,1.7,.5,1)}
.digits span.lock::after{opacity:.5}
.digits.tiered span.lock{color:var(--tc);box-shadow:0 0 22px color-mix(in srgb,var(--tc) 45%,transparent);background:color-mix(in srgb,var(--tc) 14%,transparent)}
@keyframes lockPop{0%{transform:scale(1.25)}100%{transform:none}}
.fx-tier{height:56px;margin-top:8px;font-size:46px;font-weight:700;text-transform:uppercase;color:var(--tc,#fff);opacity:0;transform:scale(.6);transition:opacity .3s,transform .5s cubic-bezier(.3,1.6,.5,1)}
.fx-tier.on{opacity:1;transform:none}
.fx-tier.ghost{opacity:.6}
.fx-tier.pop{animation:tierPop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes tierPop{0%{transform:scale(1.35);text-shadow:0 0 30px var(--tc)}100%{transform:none}}
.ladder{display:flex;gap:5px;width:100%;max-width:330px;margin-top:16px;transition:opacity .4s,margin .5s}
.lg{flex:1;min-width:0}
.lg b{display:block;position:relative;height:8px;border-radius:4px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.lg b i{position:absolute;inset:0;border-radius:4px;background:var(--c);transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 10px color-mix(in srgb,var(--c) 70%,transparent)}
.ladder.anim .lg b i{transition:transform .5s cubic-bezier(.2,.8,.3,1)}
.lg span{display:block;margin-top:7px;font-size:13px;font-weight:700;text-transform:uppercase;color:var(--c);opacity:.38;transition:opacity .3s,transform .3s;white-space:nowrap}
.lg.cur span{opacity:1;transform:scale(1.12)}
.lg.next b{animation:nearPulse .32s ease-in-out infinite alternate}
.lg.next span{opacity:calc(.4 + .6 * var(--q,0))}
@keyframes nearPulse{to{box-shadow:0 0 calc(6px + 18px * var(--q,0)) var(--c),inset 0 0 0 1px var(--c)}}
#fxIn{transition:opacity .3s cubic-bezier(.4,0,.2,1)}
/* экран дропа: шапка «ранг · множитель», маленький тикет, крупный вращающийся приз, сумма, кнопки */
.fx.done .fx-in{justify-content:flex-start;padding-top:max(calc(var(--tgTop,0px) + 22px),66px);padding-bottom:calc(46px + env(safe-area-inset-bottom,0px))}
.fx.done .digits{--dz:.84;margin:-6px 0 -8px}
.fx.done .fx-tier{height:36px;font-size:30px;margin-top:2px}
.fx.done .ladder,.fx.done .fx-need{opacity:0;height:0;margin:0;overflow:hidden}
.fx-need{height:28px;margin-top:12px;font-size:20px;line-height:28px;text-transform:uppercase;color:rgba(255,255,255,.55);transition:opacity .3s,color .3s}
.fx-need b{display:inline-block;min-width:3.2em;text-align:left;color:var(--nc,#fff);font-weight:700;font-variant-numeric:tabular-nums;margin-left:6px}
.fx-need.top{color:#ff4c35}
.fx-need.hot{animation:needPulse .4s ease-in-out infinite alternate}
@keyframes needPulse{to{transform:scale(1.08);text-shadow:0 0 14px var(--nc)}}
.fx-need.miss{color:#fff;animation:missIn .6s cubic-bezier(.3,1.6,.5,1)}
.fx-need.miss b{color:var(--nc)}
.fx.done .fx-need.miss{opacity:1;height:24px;margin:0;font-size:17px;line-height:24px;overflow:visible}
@keyframes missIn{0%{transform:scale(1.4);opacity:0}100%{transform:none;opacity:1}}
.fx-drop{position:relative;width:300px;height:0;opacity:0;transition:height .7s cubic-bezier(.25,.9,.25,1),opacity .5s .1s}
.fx.done .fx-drop{height:300px;opacity:1;margin:14px 0 8px}
.fx-drop::before{content:"";position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--tc) 45%,transparent),transparent);animation:aura 3.2s ease-in-out infinite}
@keyframes aura{50%{transform:scale(1.08);opacity:.75}}
.fx-drop .pz{position:absolute;inset:0;display:grid;place-items:center;animation:softIn .8s cubic-bezier(.2,.8,.2,1) .12s both}
@keyframes softIn{from{opacity:0;transform:scale(.8) translateY(18px)}to{opacity:1;transform:none}}
.fx-drop .tw{position:relative;width:296px;height:296px;will-change:transform}
.fx-drop .tw img{width:100%;height:100%;object-fit:contain}
.fx-drop .gl{position:absolute;inset:0;pointer-events:none;overflow:hidden;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;}
.fx-win{opacity:0;transform:translateY(14px);transition:opacity .5s .3s,transform .6s .3s cubic-bezier(.25,.9,.3,1)}
.fx.done .fx-win{opacity:1;transform:none}
.fx-win b{display:block;font-size:52px;line-height:1.05;font-weight:700;background:linear-gradient(#fff 35%,var(--tc));-webkit-background-clip:text;background-clip:text;color:transparent}
.fx-win span{display:block;font-size:20px;color:rgba(255,255,255,.6);margin-top:2px}
.fx-win b .cur{display:inline-block;height:.62em;width:auto;margin-left:.12em;vertical-align:.06em}
.fx-btns{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:320px;margin-top:18px;opacity:0;transform:translateY(10px);transition:opacity .5s .45s,transform .6s .45s cubic-bezier(.25,.9,.3,1)}
.fx.done .fx-btns{opacity:1;transform:none;margin-top:auto}
.btn-link{padding:8px 12px;font-size:19px;color:rgba(255,255,255,.75)}
.btn-ghost{width:100%;padding:13px;border-radius:999px;background:rgba(255,255,255,.07);font-size:24px;font-weight:700;text-transform:uppercase;color:rgba(255,255,255,.9)}
.fx-btns .pf{margin-top:2px;padding:6px 12px;font-size:15px;color:rgba(255,255,255,.42)}
.burst{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px var(--tc);pointer-events:none}
.pf-row{margin-bottom:12px}
.pf-row small{display:block;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:3px}
.pf-row code{display:block;font:13px/1.45 ui-monospace,Menlo,monospace;word-break:break-all;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.06);color:#d8e6ff;-webkit-user-select:text;user-select:text}
.pf-ok{font-size:20px;margin:6px 0 12px}
.pf-ok.yes{color:#12d53d}.pf-ok.no{color:#ff4c35}
.bal-delta{position:absolute;font-weight:700;font-size:22px;pointer-events:none;z-index:6}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:46}
.backdrop.on{opacity:1;pointer-events:auto}
.drawer{position:absolute;left:0;right:0;margin:0 auto;bottom:0;width:100%;max-width:560px;max-height:calc(100% - 40px);display:flex;flex-direction:column;z-index:47;
  border-radius:28px 28px 0 0;background:linear-gradient(#1f1f21,#0e0e10 30%);box-shadow:0 -10px 40px rgba(0,0,0,.5);
  transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1)}
.drawer.open{transform:none}
.drawer.drag{transition:none}
.drawer.tall{height:calc(100% - 44px)}
.dr-h{flex:none;padding:12px 20px 14px;touch-action:none;cursor:grab}
.dr-h::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:0 auto 12px}
.dr-h h3{margin:0;display:flex;align-items:baseline;justify-content:space-between;font-size:28px;font-weight:700;text-transform:uppercase;line-height:1}
.dr-h h3 small{font-size:18px;font-weight:400;color:rgba(255,255,255,.55)}
.dr-b{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 20px}
.dr-f{flex:none;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.btn-main{width:100%;padding:13px;border-radius:999px;background:linear-gradient(#24a0ff,#005ec9);font-size:24px;font-weight:700;text-transform:uppercase}
.inv{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;justify-items:center}
.inv .cell{position:relative;transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.inv .cell:active{transform:scale(.94)}
.inv .cell.sel .nc-t{box-shadow:0 0 0 3px #fff,0 0 22px color-mix(in srgb,var(--a) 80%,transparent)}
.inv .chk{position:absolute;right:-4px;top:-4px;width:24px;height:24px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;
  font-size:15px;font-weight:800;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1);z-index:2}
.inv .cell.sel .chk{transform:none}
.inv .empty{grid-column:1/-1;text-align:center;color:rgba(255,255,255,.5);font-size:20px;padding:40px 0}
.menu-top{display:flex;align-items:center;gap:12px;padding:6px 0 16px}
.menu-top img{width:52px;height:52px;border-radius:50%}
.menu-top b{display:block;font-size:26px;line-height:1.1}
.menu-top span{color:var(--blue);font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tile{padding:12px 8px;border-radius:18px;background:rgba(255,255,255,.06);text-align:center;font-size:17px;line-height:1.2}
.tile b{display:block;font-size:26px;color:var(--c,#fff)}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:21px;text-align:left}
.mrow i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);font-style:normal;flex:none}
.mrow i svg{width:20px;height:20px}
.switch{margin-left:auto;width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.switch.on{background:#12d53d}.switch.on::after{transform:translateX(18px)}
.mrow em{margin-left:auto;font-style:normal;color:rgba(255,255,255,.4);font-size:18px}
.mrow .mt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.mrow .mt small{font-size:15px;color:rgba(255,255,255,.42);font-weight:400;margin-top:2px}
.dbg-l{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.45);margin:4px 0 8px}
.dbg-g{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.dbg-c{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.08);font-size:18px;line-height:22px;text-transform:uppercase;color:var(--c);transition:background .2s,color .2s,transform .15s}
.dbg-c:active{transform:scale(.94)}
.dbg-c.on{background:var(--c);color:#000}
.dbg-c:disabled{opacity:.3}
.dbg-n{margin:0;font-size:15px;line-height:1.35;color:rgba(255,255,255,.4)}
.shake{animation:shake .3s}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}

/* ---------- ставка ---------- */
.bet{top:651px;left:calc(50% - .5px);transform:translateX(-50%);width:max-content;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:10px;min-width:160px;padding:16px;
  border-radius:999px;background:linear-gradient(#24a0ff,#005ec9);transition:padding .25s}
.bet.gifts{padding:16px 24px}
.bet b{font-weight:700;font-size:48px;line-height:61px;text-transform:uppercase;font-variant-numeric:tabular-nums}
.bet .plus{position:relative;width:15px;height:15px}
.bet .plus::before,.bet .plus::after{content:"";position:absolute;left:0;top:6px;width:15px;height:3px;border-radius:100px;background:#004b96}
.bet .plus::after{transform:rotate(90deg)}
.bet .bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.15)}}
.bet>*{flex:none}

/* ---------- кнопка крафта ---------- */
.craft{left:calc(50% + .18px);top:568px;transform:translateX(-50%) translateZ(0);overflow:visible;isolation:isolate;width:148.35px;height:86px;display:grid;place-items:center;z-index:3;touch-action:manipulation}
/* кнопка крафта: шар + наковальня + молот (молот вращается вокруг рукояти) */
.craft.busy{pointer-events:none}
.cb{position:relative;width:86px;height:86px}
.cb .orb{position:absolute;inset:0;width:86px;height:86px;border-radius:50%;animation:orbSpin 12s linear infinite}
.cb .core{position:absolute;inset:11px;border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.55),rgba(160,120,255,.15) 55%,transparent 72%);
  opacity:.35;animation:coreBreath 4.8s ease-in-out infinite;pointer-events:none}
.cb .anvil{position:absolute;left:21px;top:43px;width:44px;height:21.6px;transform-origin:50% 100%;animation:anvilIdle 4.8s ease-in-out infinite}
.cb .hammer{position:absolute;left:34px;top:18.3px;width:36px;height:22.3px;transform-origin:97% 12%;rotate:14deg;animation:hammerIdle 4.8s ease-in-out infinite}
.cb .hammer img,.cb .anvil{display:block}
.cb .hammer img{width:100%;height:100%}
.cb .glint{position:absolute;left:47px;top:43px;width:14px;height:14px;margin:-7px;pointer-events:none;opacity:0;animation:glint 4.8s ease-out infinite;
  background:radial-gradient(closest-side,#fff,rgba(255,255,255,.4) 40%,transparent);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.cb .ring{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;opacity:0;pointer-events:none}
.craft.live .hammer,.craft.live .anvil,.craft.live .glint{animation:none}
@keyframes orbSpin{to{rotate:360deg}}
@keyframes coreBreath{50%{opacity:.6;scale:1.05}}
/* покой: молот чуть «дышит», раз в цикл легонько стукает — наковальня приседает, проскакивает искорка */
@keyframes hammerIdle{0%,62%,100%{rotate:14deg}30%{rotate:17deg}70%{rotate:26deg;animation-timing-function:cubic-bezier(.6,0,.9,.5)}74%{rotate:-16deg}80%{rotate:6deg}86%{rotate:16deg}}
@keyframes anvilIdle{0%,73%,100%{transform:none}75%{transform:translateY(1px) scale(1.04,.94)}80%{transform:none}}
@keyframes glint{0%,73%{opacity:0;transform:scale(.3) rotate(0)}75%{opacity:1;transform:scale(1) rotate(20deg)}85%,100%{opacity:0;transform:scale(1.3) rotate(45deg)}}
.spark{position:absolute;left:47px;top:43px;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px var(--tier);pointer-events:none}

/* ---------- нижняя панель ---------- */
.bar{left:0;bottom:0;width:100%;display:flex;align-items:flex-end;justify-content:space-between;padding:24px 24px 37.33px}
.round{position:relative;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.round img{position:absolute;inset:0;width:48px;height:48px}
.round .cnt{position:absolute;left:0;right:0;top:12px;text-align:center;font-weight:700;font-size:19.67px;line-height:24px}
.menu-ico{width:19.2px;display:grid;gap:4.2px}
.menu-ico span{height:3.2px;border-radius:2px;background:#fff}
.chips{display:flex;gap:4px;align-items:stretch}
.chips .pill{color:var(--teal);transition:transform .12s;-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.1)}
.chips .pill:active{transform:scale(.9)}
.chips .pill.trash{width:38px;padding:2px 12px}

/* ---------- вспышка и тост ---------- */
.flash{inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 66%,color-mix(in srgb,var(--tier) 70%,#fff),transparent 60%)}
.flash.go{animation:flash .9s ease-out}
@keyframes flash{15%{opacity:.85}100%{opacity:0}}
.notes{position:absolute;left:0;right:0;top:var(--noteTop,110px);z-index:70;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 10px;pointer-events:none}
.note{position:relative;pointer-events:auto;width:100%;max-width:520px;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:22px;overflow:hidden;touch-action:none;
  background:linear-gradient(100deg,color-mix(in srgb,var(--c) 14%,#1b1b1e),#18181b 55%);box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 0 22px rgba(255,255,255,.07)}
.note-i{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 20%,transparent)}
.note-i svg{width:22px;height:22px}
.note-i.img{background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 40%,transparent),transparent)}
.note-i img{width:40px;height:40px;object-fit:contain}
.note-t{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left}
.note-t b{font-size:19px;line-height:1.15;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-t small{font-size:15px;line-height:1.25;color:rgba(255,255,255,.55);margin-top:1px}
.note-a{flex:none;padding:8px 14px;border-radius:999px;background:var(--c);color:#000;font-size:16px;font-weight:700;text-transform:uppercase}
.note-bar{position:absolute;left:16px;right:16px;bottom:0;height:2px;border-radius:2px;background:var(--c);opacity:.55;transform-origin:0 50%;animation:noteBar var(--ms,3s) linear forwards}
.note.hold .note-bar{animation-play-state:paused}
@keyframes noteBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes breathe{50%{opacity:.6}}
/* ---------- демо: фантики, фиолетовый ---------- */
.demo-tag{display:none;margin-right:2px;padding:0 6px;border-radius:99px;background:#AE3FC4;color:#160536;font-weight:700;font-size:13px;line-height:18px;text-transform:uppercase}
body.demo{--blue:#c9a4ff;--teal:#c9a4ff}
.demo .demo-tag{display:block}
.demo .bet,.demo .btn-main{background:linear-gradient(#b48aff,#5d2bd6)}
.demo .prize.ton{background-image:linear-gradient(#d4b6ff 19.47%,rgba(70,20,170,0))}
.demo .drop img[src*="hero-gem"],.demo .fx-drop img[src*="hero-gem"]{filter:hue-rotate(48deg) saturate(1.1)}
.demo #giftBtn{opacity:.35}
.demo .bet img{filter:drop-shadow(0 3px 6px rgba(40,0,90,.5))}
/* ---------- экономный режим: без WebGL, без бесконечных анимаций ---------- */
.lite #glow,.lite #fxGlow{display:none}
.lite *,.lite *::before,.lite *::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
.lite .nc-gl,.lite .gl,.lite .fx-drop::before{display:none}
.lite .digits span.blur i{filter:none}
.lite .fx *{transition-duration:.2s!important;transition-delay:0s!important}
.nogl .fx::before{content:"";position:absolute;inset:12px;border-radius:46px;pointer-events:none;
  box-shadow:inset 0 0 26px 3px color-mix(in srgb,var(--tc,#8f7dff) 55%,transparent),inset 0 0 0 1.5px color-mix(in srgb,var(--tc,#8f7dff) 70%,transparent);transition:box-shadow .4s}
/* ---------- табы в шторках ---------- */
.tabs{display:flex;gap:4px;border-bottom:2px solid rgba(255,255,255,.08)}
.tab{flex:1;padding:4px 4px 10px;font-size:19px;text-transform:uppercase;color:rgba(255,255,255,.45);position:relative;white-space:nowrap}
.tab.on{color:#fff}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:#fff;border-radius:2px}
.muted{color:rgba(255,255,255,.5);font-size:18px;line-height:1.35}
.muted.small{font-size:15px;margin:10px 0 0}
.sec-t{margin:20px 0 10px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.back{font-size:18px;color:rgba(255,255,255,.6);padding:4px 0 12px}
.pill-btn{padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.08);font-size:18px;font-weight:700;color:#fff;transition:background .2s,color .2s}
.pill-btn.on{background:#fff;color:#000}
/* ---------- история ---------- */
.hrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}
.hic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--c);background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 38%,transparent),color-mix(in srgb,var(--c) 10%,transparent))}
.hic img{width:38px;height:38px;object-fit:contain}
.hic svg{width:22px;height:22px}
.ht{flex:1;min-width:0;display:flex;flex-direction:column}
.ht b{font-size:19px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht small,.hv small{font-size:14px;color:rgba(255,255,255,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht small{color:color-mix(in srgb,var(--c) 70%,#fff)}
.hv{flex:none;display:flex;flex-direction:column;align-items:flex-end}
.hv b{font-size:19px;font-variant-numeric:tabular-nums}
.hv b.pos{color:#12d53d}
.dhead{display:flex;gap:14px;align-items:center;padding:12px;margin-bottom:16px;border-radius:20px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 22%,#151517),#151517)}
.dhead img{width:72px;height:72px;object-fit:contain}
.dhead b{display:block;font-size:24px;line-height:1.1}
.dhead span{display:block;font-size:15px;color:rgba(255,255,255,.55);margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05)}
.stats small{display:block;font-size:14px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.04em}
.stats b{font-size:24px;font-variant-numeric:tabular-nums}
.bars>div{display:grid;grid-template-columns:84px 1fr 92px;align-items:center;gap:10px;margin-bottom:10px}
.bars span{font-size:16px;text-transform:uppercase;color:var(--c)}
.bars i{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.06)}
.bars i b{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--c)}
.bars i em{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:#fff;opacity:.7;border-radius:1px}
.bars small{font-size:14px;color:rgba(255,255,255,.5);text-align:right;font-variant-numeric:tabular-nums}
/* ---------- provably fair: объяснение ---------- */
.lead{font-size:19px;line-height:1.35;color:rgba(255,255,255,.8);margin:0 0 8px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.steps i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#00d9ff;color:#000;font-style:normal;font-weight:700;font-size:17px}
.steps b{font-size:19px}
.steps p{margin:3px 0 0;font-size:16px;line-height:1.35;color:rgba(255,255,255,.6)}
.steps p b{font-size:inherit;color:#fff}
.rng{display:grid;gap:6px}
.rng div{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) 10%,#151517)}
.rng b{color:var(--c);font-size:17px;text-transform:uppercase}
.rng span{font-size:15px;font-family:ui-monospace,Menlo,monospace;color:#d8e6ff}
.rng em{font-style:normal;font-size:14px;color:rgba(255,255,255,.5)}
.why{margin:0;padding-left:20px;font-size:16px;line-height:1.45;color:rgba(255,255,255,.7)}
.cseed{display:flex;gap:8px;align-items:center}
.cseed code{flex:1;font:15px ui-monospace,Menlo,monospace;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);color:#d8e6ff}
.pfi-btns{display:flex;flex-direction:column;gap:8px;margin-top:22px}
/* ---------- кошелёк ---------- */
.wbal{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);margin-top:6px}
.wbal small{font-size:15px;color:rgba(255,255,255,.5);text-transform:uppercase}
.wbal b{display:flex;align-items:center;gap:6px;font-size:24px;color:var(--blue)}
.wbal b img{width:22px}
.amt{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:18px 0 10px}
.amt input{width:200px;background:none;border:0;outline:0;color:#fff;font:700 64px var(--font);text-align:right;-moz-appearance:textfield}
.amt input::-webkit-inner-spin-button,.amt input::-webkit-outer-spin-button{-webkit-appearance:none}
.amt span{font-size:26px;color:rgba(255,255,255,.5)}
.presets{display:flex;gap:6px;justify-content:center}
.methods{display:grid;gap:8px}
.meth{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);text-align:left;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s}
.meth.on{box-shadow:inset 0 0 0 1.5px #30a5ff}
.meth i{flex:none;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.meth.on i{box-shadow:inset 0 0 0 6px #30a5ff}
.meth b{display:block;font-size:19px}
.meth small{font-size:14px;color:rgba(255,255,255,.45)}
.onft{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;justify-items:center}
.onft .cell{position:relative;border-radius:16%}
.onft .cell.sel .nc-t{box-shadow:0 0 0 3px #fff}
.btn-main.wait{opacity:.7}
/* ---------- кейсы ---------- */
.drawer.black{background:#000}
.paid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.pcase img{display:block;width:100%;height:auto}
.prow{display:flex;gap:6px;align-items:center}

.partner span:nth-child(2){flex:1;display:flex;flex-direction:column}

/* ---------- звания ---------- */
.rkbar{padding:12px 14px;border-radius:16px;background:linear-gradient(110deg,#3a2f05,#1a1508);margin:6px 0 10px}

.menu-top .mrank{display:inline-block;margin-left:8px;padding:0 8px;border-radius:99px;background:rgba(255,210,58,.16);color:#FFB835;font-size:14px;line-height:22px;vertical-align:4px;text-transform:uppercase}
/* ---------- кейсы v2: в стиле приложения ---------- */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ccard{position:relative;display:flex;flex-direction:column;align-items:center;padding:12px 10px 10px;border-radius:24px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--c) 34%,transparent),transparent 70%),linear-gradient(#1f1f21,#111113);box-shadow:inset 0 0 22px color-mix(in srgb,var(--c) 25%,transparent)}
.ccard>img{width:100%;height:auto;margin:-2px 0 2px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.ccard>b{font-size:19px;text-transform:uppercase;color:color-mix(in srgb,var(--c) 60%,#fff);margin-bottom:8px}
.crow{display:flex;gap:6px;width:100%}
.cbuy{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:999px;background:linear-gradient(#24a0ff,#005ec9);font-size:22px;font-weight:700;text-transform:uppercase}
.cbuy img{width:20px;filter:brightness(10)}
.cbuy.locked{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5)}
.cinfo{flex:none;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);font:700 22px var(--font)}
.fcard{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 6px;border-radius:24px;
  background:radial-gradient(90% 120% at 0% 50%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%),linear-gradient(#1f1f21,#111113);box-shadow:inset 0 0 22px color-mix(in srgb,var(--c) 25%,transparent)}
.fcard>img{width:44%;height:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.fc-t{flex:1;min-width:0;display:flex;flex-direction:column}
.fc-t>b{font-size:22px;text-transform:uppercase;color:color-mix(in srgb,var(--c) 60%,#fff)}
.fc-t>small{font-size:14px;color:rgba(255,255,255,.55);line-height:1.25}
.prog{display:block;height:6px;margin:8px 0 10px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.prog b{display:block;height:100%;border-radius:3px;background:var(--c)}
.trk{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.06)}
.trk i{flex:none;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);display:grid;place-items:center;color:#000}
.trk.ok i{background:#12d53d;box-shadow:none}
.trk i svg{width:17px;height:17px;stroke-width:3}
.trk span{flex:1;display:flex;flex-direction:column}
.trk b{font-size:19px}
.trk small{font-size:14px;color:rgba(255,255,255,.45)}
.trk.ok b{color:rgba(255,255,255,.45)}
.trk em{display:flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:rgba(48,165,255,.14);font-style:normal;font-size:18px;font-weight:700;color:#30a5ff}
.trk em img{width:16px}
.days{margin:12px 0 4px}
.days span{width:38px;height:38px}
/* плитки предметов — как карточки ленты */
.ct{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;width:96px;height:120px;padding:9px 4px 11px;border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 8%,#151517) 10%,color-mix(in srgb,var(--c) 38%,#151517));box-shadow:inset 0 0 22px color-mix(in srgb,var(--c) 28%,transparent)}
.ct::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--c);box-shadow:0 0 10px 1px var(--c)}
.ct b{font-size:15px;line-height:1.1;font-weight:700;white-space:nowrap;color:color-mix(in srgb,var(--c) 45%,#fff)}
.ct small{font-size:14px;color:rgba(255,255,255,.7)}
.ct img{width:54px;height:54px;object-fit:contain}
.ct .tq{width:50px;height:50px;color:var(--c);filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c) 60%,transparent))}
.ct .tq svg{width:100%;height:100%}
.ct .xpi{font:800 34px/1 var(--font);background:linear-gradient(#b8ffcb,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.ct .shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.3) 50%,transparent 65%);transform:translateX(-120%);animation:shine 2.8s ease-in-out infinite}
.ct.win{box-shadow:inset 0 0 0 2px #fff,0 0 26px color-mix(in srgb,var(--c) 70%,transparent)}
.modal .mbox{background:radial-gradient(100% 60% at 50% 0%,color-mix(in srgb,var(--c) 26%,transparent),transparent 70%),linear-gradient(#1f1f21,#0e0e10);box-shadow:inset 0 0 22px color-mix(in srgb,var(--c) 22%,transparent),0 20px 60px rgba(0,0,0,.6);transition:background .4s}
.modal .mbox h4{text-transform:uppercase;font-size:28px;color:color-mix(in srgb,var(--c) 55%,#fff)}
.mline{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;border-radius:2px;background:#fff;box-shadow:0 0 12px 2px rgba(255,255,255,.6);z-index:2}
.roul{background:rgba(0,0,0,.35)}
/* ---------- NFT-карточка в духе Telegram: номер сверху, цена в теле ---------- */
.nc{height:calc(var(--w) * 1.24)}
.nc-t{border-radius:calc(var(--w) * .17)}
.nc-bg{background:radial-gradient(circle at 50% 40%,var(--a) 0%,var(--b) 80%)}
.nc-img{left:15%;top:16%;width:70%;height:57%}
.nc-rb{display:none}
.nc-num{position:absolute;left:0;right:0;top:5.5%;z-index:1;text-align:center;font-size:calc(var(--w) * .105);line-height:1.2;font-weight:700;letter-spacing:.02em;color:color-mix(in srgb,var(--p) 70%,#fff);opacity:.85}
.nc-pr{position:absolute;left:50%;bottom:7%;z-index:1;transform:translateX(-50%);display:flex;align-items:center;gap:calc(var(--w) * .03);padding:calc(var(--w) * .012) calc(var(--w) * .08);
  border-radius:99px;background:rgba(0,0,0,.24);font-size:calc(var(--w) * .15);line-height:1.3;font-weight:700;white-space:nowrap}
.nc-pr img{width:calc(var(--w) * .13);height:auto}
.nc.big{height:calc(var(--w) * 1.16)}
.nc.big .nc-img{left:19%;top:6%;width:62%;height:62%}
.nc-cap{position:absolute;left:0;right:0;bottom:7%;z-index:1;text-align:center;padding:0 6%}
.nc-cap b{display:block;font-size:calc(var(--w) * .12);line-height:1.05;font-weight:700}
.nc-cap small{display:block;margin-top:calc(var(--w) * .015);font-size:calc(var(--w) * .062);color:color-mix(in srgb,var(--p) 65%,#fff)}
.slot .chip{display:none}
.fx.done .fx-drop{height:312px}
.ccard>img,.fimgs img,.fcard>img,.mcase{-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
/* заглушка NFT на главной */
.dskel{display:grid;place-items:center;width:100%;height:100%}
.dskel .tq{width:58%;height:58%;color:var(--tier);opacity:.55;animation:skelPulse .9s ease-in-out infinite alternate;filter:drop-shadow(0 0 24px var(--tier))}
.dskel .tq svg{width:100%;height:100%}
/* ---------- v20 ---------- */
/* плавная смена текста без прыжков */
.xf{display:inline-block;background-image:inherit;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.xf.in{position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap}
.chance{transition:left .5s cubic-bezier(.25,.8,.25,1),background .4s}
.tind{transition:transform .5s cubic-bezier(.25,.8,.25,1),width .5s cubic-bezier(.25,.8,.25,1),background .3s,box-shadow .3s}
@keyframes depthIn{from{opacity:0;scale:var(--z0,.94)}to{opacity:1;scale:1}}
@keyframes depthOut{to{opacity:0;scale:var(--z1,1.04)}}
.drop.sl{animation:depthIn .6s cubic-bezier(.25,.8,.25,1) both;animation-delay:var(--dl,0s)}
.drop.sl.out{animation:depthOut .32s ease-in both}
/* заглушка NFT на главной — наш пустой гем, мягко пульсирует */
.dskel{display:grid;place-items:center;width:100%;height:100%}
.dskel img{width:100%;height:100%;object-fit:contain;animation:skelPulse 1s ease-in-out infinite alternate}
/* шкала рангов: заливка сдвигом внутри скруглённой дорожки — края всегда ровные */
.lg b{overflow:hidden}
.lg b i{transform:translateX(-100%);transform-origin:0 50%;border-radius:4px;box-shadow:none}
/* силуэты молота и наковальни: без цветной обводки, тёплое свечение кузни */
.fx-intro{--ic:#ff8a3c}
.fx-intro .fi-a,.fx-intro .fi-h img{filter:brightness(0) invert(.12) drop-shadow(0 14px 30px rgba(255,120,40,.16))}
.fi-sp{width:5px;height:5px;margin:-2.5px;background:#ffe2a8;box-shadow:0 0 6px 2px #ff8a1e,0 0 14px 3px rgba(255,90,0,.45)}
.fi-ring{position:absolute;left:141px;top:129px;width:150px;height:30px;margin:-15px -75px;border-radius:50%;border:2px solid #ffb35c;box-shadow:0 0 18px #ff7a1e;opacity:0;pointer-events:none}
.fi-heat{position:absolute;left:66px;top:126px;width:126px;height:8px;border-radius:4px;background:linear-gradient(90deg,transparent,#ff8a1e,#ffd28a,#ff8a1e,transparent);filter:blur(3px);opacity:0;pointer-events:none}
/* XP — фирменная иконка */
.xpimg{width:1.1em;height:auto;vertical-align:-.18em;margin-right:3px}
.ct .tnft{width:60px;height:60px}
.ct.isnft .tnft{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c) 60%,transparent))}
/* экран кейса на чёрном экране с рамкой */
.fx-case{display:none;width:100%;text-align:center}
.fx.case .fx-top{display:none}
.fx.case .fx-case{display:block}

/* меню: баннер бонусов */

.hps{display:flex;flex:none}

.hk-ar{color:rgba(255,255,255,.4)}
.hk-ar svg{width:22px;height:22px}
.hcard.w{display:flex;align-items:center;gap:12px;padding:12px 14px}
.hk-ic{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}

.hk-amt{flex:none;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.hempty{margin:30px 0;text-align:center;font-size:19px;color:rgba(255,255,255,.5)}
.hstat-hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.hstat-hero small,.hstat small{display:block;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.hstat-hero b{display:block;font-size:38px;line-height:1.05;color:color-mix(in srgb,var(--c) 70%,#fff);font-variant-numeric:tabular-nums}
.hstat-hero span{font-size:14px;color:rgba(255,255,255,.55)}
.hstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hstat div{padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--c) 13%,#151517)}
.hstat b{display:block;margin-top:2px;font-size:26px;line-height:1.1;color:color-mix(in srgb,var(--c) 75%,#fff);font-variant-numeric:tabular-nums}
.hsec{margin:22px 0 12px;font-size:20px;font-weight:700;text-transform:uppercase}
.hnote{margin:10px 0 0;font-size:15px;line-height:1.4;color:rgba(255,255,255,.55)}
.hdet{margin-bottom:14px;padding:14px;border-radius:24px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 24%,#17171b),#17171b 60%);box-shadow:inset 0 0 22px color-mix(in srgb,var(--c) 30%,transparent)}
.hd-sec{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px}
.hd-sec span{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6)}

.hd-row>span{flex:1;min-width:0;display:flex;flex-direction:column}
.hd-row b{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-row small{font-size:14px;color:rgba(255,255,255,.55)}
.hd-row em{flex:none;font-style:normal;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

/* проверка честности */
.pfres{display:flex;flex-direction:column;align-items:center;margin-bottom:12px;padding:16px;border-radius:24px;background:radial-gradient(100% 130% at 50% 0,color-mix(in srgb,var(--c) 42%,#151517),#151517)}
.pfres small{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.pfres b{font-size:56px;line-height:1.05;font-variant-numeric:tabular-nums}
.pfres span{font-size:20px;text-transform:uppercase;color:color-mix(in srgb,var(--c) 60%,#fff)}
.pfc{display:flex;gap:12px;margin-bottom:8px;padding:14px;border-radius:20px;background:rgba(255,255,255,.05);transition:background .35s,box-shadow .35s}
.pfc>i{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);font-style:normal;font-weight:700;transition:background .3s}
.pfc b{display:block;font-size:20px;line-height:1.15}
.pfc p{margin:4px 0 0;font-size:16px;line-height:1.38;color:rgba(255,255,255,.72)}
.pfc em{display:inline-block;margin-top:8px;font-style:normal;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#FFB835}
.pfc.ok{background:rgba(18,213,61,.1);box-shadow:inset 0 0 22px rgba(18,213,61,.5)}
.pfc.ok>i{background:#12D53D;box-shadow:none;color:#032b0c}.pfc.ok>i::after{content:"✓"}
.pfc.ok em{color:#12D53D}
.pfc.no{background:rgba(255,76,53,.1);box-shadow:inset 0 0 22px rgba(255,76,53,.5)}
.pfc.no>i{background:#FF4C35;box-shadow:none}.pfc.no>i::after{content:"✕"}
.pfc.no em{color:#FF4C35}
.pfnote{margin:2px 2px 10px;font-size:15px;line-height:1.35;color:#FFB835}
.pf-check{margin-top:6px}
.pf-check.done{background:linear-gradient(#3fe06a,#0a9a2c)}
.pf-check.bad{background:linear-gradient(#ff6a55,#c22a14)}
.pf-copy{margin-top:8px}
.pfi-hero{padding:18px;border-radius:24px;background:linear-gradient(135deg,#075a78,#0b1d33);box-shadow:inset 0 0 22px rgba(0,217,255,.4)}
.pfi-hero h4{margin:0 0 8px;font-size:28px;line-height:1.05;text-transform:uppercase;color:#00D9FF}
.pfi-hero p{margin:0;font-size:18px;line-height:1.4;color:rgba(255,255,255,.88)}
.pfi-env{display:flex;gap:12px;margin-top:10px;padding:14px;border-radius:22px;background:rgba(255,184,53,.1);box-shadow:inset 0 0 22px rgba(255,184,53,.4)}
.pfi-env>i{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:#FFB835;color:#2a1a08}
.pfi-env>i svg{width:24px;height:24px}
.pfi-env b,.pfi-step b{display:block;font-size:20px;line-height:1.15}
.pfi-env b{color:#FFB835}
.pfi-env p,.pfi-step p{margin:4px 0 0;font-size:16px;line-height:1.4;color:rgba(255,255,255,.78)}
.pfi-t{margin:24px 0 10px;font-size:22px;font-weight:700;text-transform:uppercase}
.pfi-step{display:flex;gap:12px;margin-top:8px;padding:14px;border-radius:22px;background:rgba(255,255,255,.05)}
.pfi-step>i{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--c);color:#06121a;font-style:normal;font-weight:700;font-size:18px}
.pfi-step b{color:color-mix(in srgb,var(--c) 70%,#fff)}
.pfi-p{margin:0 0 10px;font-size:16px;line-height:1.4;color:rgba(255,255,255,.75)}
.rng em{font-size:16px;font-weight:700;color:rgba(255,255,255,.75)}

/* v27 */
:root{--serif:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* длинные тексты — антиква: строчные буквы, легче читать */
.bnote,.sect-h small,.rules ol,.facts span,.pfc p,.pfi-hero p,.pfi-env p,.pfi-step p,.pfi-p,.hnote,.pfnote,.dr-sub,.gin p,.gin ol,.lead,.muted,.sdtarget p,
.banner.amb small,.mb-t>small,.note-t small,.dbg-n,.wcon p,.refauto small,.refauto em,.sdmiss,.steps p,.why,.cinfo-h small{
  font-family:var(--serif);text-transform:none;letter-spacing:0;font-weight:400}
.bnote,.rules ol,.pfc p,.pfi-hero p,.pfi-env p,.pfi-step p,.pfi-p,.hnote,.gin p,.lead,.muted{font-size:13.5px;line-height:1.45}
.sect-h small,.facts span,.dr-sub,.banner.amb small,.mb-t>small,.note-t small,.sdtarget p,.refauto small,.refauto em,.pfnote,.dbg-n{font-size:12.5px;line-height:1.4}
.note-t small{font-size:12.5px}
.dr-sub b,.pfi-p b{font-family:var(--font);font-weight:700}
.rules li::marker{font-family:var(--font);color:rgba(255,255,255,.5)}
/* персонаж стоит за сундуком, сбоку — сундук на переднем плане */
.cart{aspect-ratio:1/1}
.cart .chest{left:0;bottom:0;width:78%;z-index:1}
.cart .who{left:auto;right:-8%;top:-12%;width:56%;transform:none;z-index:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.hd-row>.hp{flex:none;display:grid;place-items:center}
/* супер дроп: без фона — крупный подарок и логотип */
.sdhero{background:none;padding:4px 0 0;overflow:visible}
.sdlogo{width:84%;margin-top:-34px}
.sdmiss{display:block;width:max-content;max-width:100%;margin:10px auto 0;padding:7px 14px;border-radius:14px;background:rgba(235,87,176,.18);color:#EB57B0;font-size:15px}
/* плитки предметов тянутся по ширине */
.tgrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));justify-content:stretch}
.tgrid .ct{width:auto;height:auto;aspect-ratio:.8}
.tgrid .ct img,.tgrid .ct .tnft{width:58%;height:auto;aspect-ratio:1}
/* история: картинки без серых рамок, GRAM — на синем */
.hp{box-shadow:none;background:color-mix(in srgb,var(--c) 32%,#1d1d22)}
.hps .hp+.hp{margin-left:-12px;box-shadow:-6px 0 12px rgba(0,0,0,.55)}
.hp.g{background:linear-gradient(160deg,#36adff,#0062d1)}
.hp.g img{width:24px;height:24px;filter:brightness(0) invert(1)}
.hk-v small{color:rgba(255,255,255,.7)}
/* палитра без блёклых оттенков */
.hstat b,.hstat-hero b,.facts b,.pfres span,.pfi-step b{color:var(--c)}
.hstat div{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 30%,#141418),color-mix(in srgb,var(--c) 8%,#141418))}
.hstat-hero div{background:linear-gradient(140deg,color-mix(in srgb,var(--c) 45%,#141418),color-mix(in srgb,var(--c) 10%,#141418))}
.hstat-hero.one{grid-template-columns:1fr;margin-bottom:12px}
.hstat-hero.one span{font-family:var(--serif);font-size:12.5px}
.tav{background:var(--tc,#30A5FF);color:#0b0b0e}
.sec-t{font-size:17px;color:rgba(255,255,255,.8)}
.facts div{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 26%,#141418),color-mix(in srgb,var(--c) 8%,#141418))}
.sect{background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(255,255,255,.03))}
/* друзья: начисляется само */
.refauto{display:flex;align-items:center;gap:12px;margin-top:8px;padding:14px;border-radius:20px;background:linear-gradient(135deg,rgba(48,165,255,.32),rgba(48,165,255,.08))}
.refauto>span{flex:1;display:flex;flex-direction:column;gap:2px}
.refauto b{display:flex;align-items:center;gap:6px;font-size:28px;color:#30A5FF}
.refauto b img{width:20px}
.refauto em{font-style:normal;color:rgba(255,255,255,.75)}
.drop.still{animation:none}

/* v28 */
.cb{translate:0 16px}
.drops{z-index:1}
.bet{z-index:4}
.craft{z-index:5}
.fx-intro .fi-orb{position:absolute;left:0;top:0;width:258px;height:258px;border-radius:50%;pointer-events:none}
.cinfo-h{padding-top:30px}
.bcase{padding-top:20px}
/* плитки предметов — сочные, без серого */
.ct{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 55%,#0e0e12) 0%,color-mix(in srgb,var(--c) 92%,#0e0e12) 100%)}
.ct small{color:#fff}
/* нейтральные карточки — с синевой вместо серого */
.sect,.rules,.stats div,.refbox,.hd-row,.pfc,.pfi-step,.trow.me,.hcard.w{background:linear-gradient(160deg,rgba(48,165,255,.17),rgba(48,165,255,.05))}
.hcard.w{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 26%,#121a28),#121a28 75%)}
/* тултип: тикет супер дропа при маленькой ставке */
.fx-top{position:relative}
.sdtip{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);z-index:6;width:max-content;white-space:nowrap;padding:8px 12px;border-radius:12px;background:#EB57B0;color:#fff;
  font:500 13px/1.3 var(--serif);text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.45);animation:tipIn .4s cubic-bezier(.25,1.4,.4,1) both .3s}
.sdtip b{font-weight:700}
.sdtip::before{content:"";position:absolute;left:50%;top:-5px;width:10px;height:10px;margin-left:-5px;background:#EB57B0;transform:rotate(45deg);border-radius:2px}
@keyframes tipIn{from{opacity:0;translate:0 -6px}}
.sdnext{display:inline-block!important;margin-top:10px;padding:5px 14px;border-radius:999px;background:linear-gradient(90deg,#EB57B0,#AE3FC4);color:#fff!important;font-size:15px;font-weight:700;text-transform:uppercase;animation:sdPulse 1.4s ease-in-out infinite}
@keyframes sdPulse{50%{box-shadow:0 0 18px rgba(235,87,176,.7)}}

/* v29: экран неудачи */
.fx.fail .ladder,.fx.fail .fx-need{display:none}
.tw.failw img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 30px rgba(255,76,53,.35))}
.fx-win b.failt{color:#FF4C35}
.fx-win .failtk{display:inline-block!important;margin:4px 0 2px;padding:3px 12px;border-radius:999px;background:rgba(255,76,53,.16);color:#FF4C35;font-size:16px;font-weight:700;letter-spacing:.08em}

/* v30 */
.item i img{display:none}
/* баннер бонусов: сундуки крупнее и заполняют правую часть */
.mbonus{min-height:136px}
.mbonus::after{content:"";position:absolute;right:-30px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.35),transparent);pointer-events:none}
.mb-t{max-width:52%}
.mb-art{right:-18px;bottom:-14px;z-index:1}
.mb-art .cart{width:136px}
.mb-art .cart+.cart{margin-left:-58px;width:118px}
/* баннеры истории и честности */
.mban2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.mb2{position:relative;display:flex;flex-direction:column;justify-content:flex-start;min-height:112px;padding:14px;border-radius:22px;overflow:hidden;text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.mb2.hist{background:linear-gradient(130deg,#30A5FF 0%,#AE3FC4 100%)}
.mb2.pf{background:linear-gradient(130deg,#12D53D 0%,#00D9FF 100%)}
.mb2-t{position:relative;z-index:1;display:flex;flex-direction:column;gap:2px}
.mb2-t b{font-size:24px;line-height:1;text-transform:uppercase}
.mb2-t small{max-width:80%;font-family:var(--serif);font-size:12px;line-height:1.3;color:rgba(255,255,255,.92)}
.mb2.pf .mb2-t b,.mb2.pf .mb2-t small{color:#062417}
.mb2-art{position:absolute;right:-8px;bottom:-14px}
.mb2.hist .mb2-art img{position:absolute;right:calc(var(--i) * 34px);bottom:calc(var(--i) * 4px);width:58px;height:58px;object-fit:contain;rotate:calc(var(--i) * -12deg + 8deg);filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));z-index:calc(3 - var(--i))}
.mb2.hist .mb2-art{width:130px;height:70px}
.mb2-sh{display:grid;place-items:center;width:66px;height:66px;margin:0 6px 4px auto;border-radius:20px;background:rgba(255,255,255,.28);color:#fff;rotate:-10deg;box-shadow:0 8px 18px rgba(0,60,40,.25)}
.mb2-sh svg{width:38px;height:38px;stroke-width:2.2}
.mb2.pf .mb2-art em{position:absolute;right:62px;bottom:16px;padding:2px 7px;border-radius:8px;background:#062417;color:#12D53D;font-style:normal;font-size:15px;font-weight:700;letter-spacing:.06em;rotate:6deg}
/* шторка подарков: три кнопки и режим продажи */
.dr-f.three{display:flex;gap:8px}

<script>
/* загрузчик: картинки моделей и символов подарков (скачаны с changes.tg) лежат двумя файлами — подтягиваем их до старта приложения */
(async () => {
  const bar = document.getElementById('bootBar'), set = k => { if (bar) bar.style.width = (k * 100).toFixed(0) + '%'; };
  async function load(url, w0, w1){
    const r = await fetch(url); if (!r.ok) throw new Error(r.status);
    const total = +r.headers.get('content-length') || 0, rd = r.body && total ? r.body.getReader() : null;
    if (!rd){ const j = await r.json(); set(w1); return j; }
    const parts = []; let got = 0;
    for (;;){ const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; set(w0 + (w1 - w0) * Math.min(1, got / total)); }
    return JSON.parse(new TextDecoder().decode(await new Blob(parts).arrayBuffer()));
  }
  window.GIMG = {};
  try {
    const [m, s] = await Promise.all([load('assets/g/models.json', 0, .85), load('assets/g/syms.json', .85, 1)]);
    for (const [k, v] of Object.entries(Object.assign(m, s))){
      const bin = atob(v), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      GIMG[k] = URL.createObjectURL(new Blob([u8], { type: 'image/webp' }));
    }
  } catch (e){ console.warn('gift images not loaded', e); }
  const app = document.createElement('script'); app.textContent = document.getElementById('app').textContent; document.body.appendChild(app);
  const b = document.getElementById('boot'); b.classList.add('off'); setTimeout(() => b.remove(), 500);
})();
</script>

/* NFT с релеера @pawngift: модель, фон (центр, край, узор), символ, средняя цена. Картинки — с cdn.changes.tg,
   если они не загрузились (нет сети) — подставляется локальная заглушка */
const LOCAL_NFT = ['bronze-cane', 'candy-cane', 'jelly-bunny', 'honey-bee', 'bday', 'smile-eggs', 'cat-ring', 'magic-ball', 'cat-globe', 'butterfly-egg', 'cheshire', 'genesis', 'agent'];
const FB = {};
const hashStr = t => [...t].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7);
// картинки моделей и символов скачаны с changes.tg и лежат в assets/g (модели 220px, символы 72px)
const NFTS = RELAY.g.map(([ci, num, model, bi, sym, price, mf, sf]) => {
  const name = RELAY.c[ci], bd = RELAY.b[bi], src = mf && GIMG[mf] ? GIMG[mf] : `assets/nft/${LOCAL_NFT[hashStr(name) % LOCAL_NFT.length]}.webp`;
  return { name, num, model, backdrop: bd[0], bg: [bd[1], bd[2], bd[3]], symbol: sym, sym: sf && GIMG[sf] ? GIMG[sf] : '', price, src };
});
document.addEventListener('error', e => { const t = e.target; if (t.tagName === 'IMG' && FB[t.getAttribute('src')]) t.src = FB[t.getAttribute('src')]; }, true);
/* узор карточки — символ коллекции кольцами вокруг центра; пока символ не загрузился (или без сети) — звёздочки */
const SYM_RINGS = [[27, 8, 10], [39, 12, 8], [51, 16, 6.5]];
const SYM_LAYERS = SYM_RINGS.flatMap(([R, n, sz], ri) => Array.from({ length: n }, (_, k) => { const a = (k + (ri % 2) * .5) / n * Math.PI * 2; return [50 + Math.cos(a) * R, 50 + Math.sin(a) * R, sz]; }));
document.documentElement.style.setProperty('--sympos', SYM_LAYERS.map(([x, y, sz]) => `${((x - sz / 2) / (100 - sz) * 100).toFixed(2)}% ${((y - sz / 2) / (100 - sz) * 100).toFixed(2)}%`).join(','));
document.documentElement.style.setProperty('--symsize', SYM_LAYERS.map(([, , sz]) => `${sz}% ${sz}%`).join(','));
const symImg = u => SYM_LAYERS.map(() => `url("${u}")`).join(',');
const SYM_OK = new Set(), SYM_TRY = new Set();
function symLoad(u){
  if (SYM_TRY.has(u)) return; SYM_TRY.add(u);
  const im = new Image(); im.crossOrigin = 'anonymous';
  im.onload = () => { SYM_OK.add(u); document.querySelectorAll('.nc-pat[data-sym]').forEach(el => { if (el.dataset.sym === u){ el.classList.add('sym'); el.style.setProperty('--symimg', symImg(u)); } }); };
  im.src = u;
}
const giftOf = (n, extra = {}) => ({ id: 'g' + Math.random().toString(36).slice(2, 9), num: n.num, nft: n, a: n.bg[0], b: n.bg[1], p: n.bg[2], value: n.price, skin: n.model, ...extra });

const CARD_BG = [['#e36692', '#c9497c', '#ffd1e3'], ['#5aa9ff', '#2f6fd6', '#cfe6ff'], ['#12D53D', '#1f9a5c', '#d4ffe6'], ['#ffc35a', '#d98a1f', '#fff0c2'],
  ['#AE3FC4', '#6a3ad6', '#e6d6ff'], ['#3fd6d0', '#1a8f9a', '#d0fffb'], ['#ff7a6b', '#c9352c', '#ffe0db']];

/* узор как у коллекционных подарков Telegram: символы кольцами вокруг центра, к краю мельче и прозрачнее */
(() => {
  const star = (x, y, r, o) => `<path opacity="${o}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${r.toFixed(2)})" d="M0-1l.28.72L1 0 .28.28 0 1-.28.28-1 0-.28-.28z"/>`;
  let p = '';
  [[24, 7, 4.4, .9], [33, 11, 3.7, .75], [42, 15, 3.1, .6], [51, 19, 2.6, .45], [60, 23, 2.2, .3]].forEach(([R, n, sz, o], ri) => {
    for (let k = 0; k < n; k++){ const a = (k + (ri % 2) * .5) / n * Math.PI * 2; p += star(50 + Math.cos(a) * R, 50 + Math.sin(a) * R, sz, o); }
  });
  document.documentElement.style.setProperty('--pat', `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${p}</svg>`)}")`);
})();

/* ---------- масштаб сцены ---------- */
const stage = $('stage');
/* фуллскрин: ширина макета = ширина экрана. Высота сцены подстраивается под экран;
   если экран совсем короткий (меньше 790 «макетных» px), уменьшаем масштаб, чтобы всё влезло */
/* адаптив по ширине: масштаб берём от ширины, но не больше 1.15 — на широких экранах
   макет не раздувается, а растягивается: фон, панель, лента и нижняя панель — на всю ширину, центр — по центру */
let K = 1, SW = 390;
function fit(){
  let k = Math.min(innerWidth / 390, 1.15), H = innerHeight / k;
  if (H < 790){ k = innerHeight / 790; H = 790; }
  if (innerWidth / k < 390){ k = innerWidth / 390; H = innerHeight / k; }   // никогда не обрезаем по бокам
  K = k; SW = Math.max(390, innerWidth / k);
  stage.style.width = SW + 'px';
  stage.style.height = H + 'px';
  stage.style.transform = `scale(${k})`;
  // баланс: в макете 43 px сверху; на коротких экранах поджимается вместе с зазором
  // верх контента в Telegram fullscreen: статус-бар + кнопки Telegram

/* свайп влево/вправо по экрану — соседний ранг. Контент тянется за пальцем с параллаксом, на краях — сопротивление */
(() => {
  const movers = [['range', .55], ['prize', .28], ['drops', .42]];
  let x0 = null, y0 = 0, dx = 0, act = false, t0 = 0, pid = 0, lx = 0, lt = 0, vx = 0;
  $('scene').addEventListener('pointerdown', e => {
    if (S.busy || openDrawer || e.target.closest('button:not(.tier), .slot, .live, .bar, .bet')) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; act = false; pid = e.pointerId; t0 = lt = performance.now(); lx = e.clientX; vx = 0;
  });
  addEventListener('pointermove', e => {
    if (x0 === null || e.pointerId !== pid) return;
    const mx = (e.clientX - x0) / K, my = (e.clientY - y0) / K, now = performance.now();

    dx = (e.clientX - x0) / K;
    const edge = (dx > 0 && S.tier === 0) || (dx < 0 && S.tier === TIERS.length - 1);
    const k = Math.min(1, Math.abs(dx) / 140) * (edge ? .3 : 1);

  });

})();

document.querySelectorAll('.drawer').forEach(dr => {
  const body = dr.querySelector('.dr-b');
  let y0 = null, x0 = 0, dy = 0, t0 = 0, armed = false, moved = false;
  const start = (x, y, target) => { y0 = y; x0 = x; dy = 0; t0 = performance.now(); moved = false; armed = !!target.closest('.dr-h'); };
  // возвращает true, если жест наш (тогда гасим прокрутку)
  const move = (x, y) => {
    if (y0 === null) return false;
    const d = (y - y0) / K;
    if (!armed){
      if (Math.abs(x - x0) > 14 || d < -4){ y0 = null; return false; }
      if (d > 6 && (!body || body.scrollTop <= 0)){ armed = true; y0 = y; } else return false;
    }
    moved = true; dr.classList.add('drag');
    dy = Math.max(0, (y - y0) / K); dr.style.transform = `translateY(${dy}px)`;
    return true;
  };
  const end = () => {
    if (y0 === null && !armed) return; y0 = null;
    if (!armed) return; armed = false;
    const v = dy / Math.max(1, performance.now() - t0);
    dr.classList.remove('drag');
    if (dy > 80 || (dy > 24 && v > .45)) hideDrawer(); else dr.style.transform = '';
  };
  dr.addEventListener('touchstart', e => start(e.touches[0].clientX, e.touches[0].clientY, e.target), { passive: true });
  dr.addEventListener('touchmove', e => { if (move(e.touches[0].clientX, e.touches[0].clientY) && e.cancelable) e.preventDefault(); }, { passive: false });
  dr.addEventListener('touchend', end); dr.addEventListener('touchcancel', end);
  // мышь (десктоп-превью)
  dr.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.button) return; start(e.clientX, e.clientY, e.target); });
  window.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') move(e.clientX, e.clientY); });
  window.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') end(); });
  // клик после перетаскивания не должен выбирать подарок
  dr.addEventListener('click', e => { if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
});

/* =========================================================
   ПСЕВДО-3D: карточки и NFT сами медленно поворачиваются, по ним едет голографическая фольга,
   картинка и узор фона смещаются в разные стороны (параллакс). Двигаем только transform и пару переменных у нескольких элементов
   ========================================================= */
const Tilt = (() => {
  const items = new Set();
  let ph = Math.random() * 10, last = 0, prev = 0;
  function frame(now){
    requestAnimationFrame(frame);
    const dt = prev ? Math.min(.1, (now - prev) / 1000) : 0; prev = now;
    // карточку крутят пальцем или она доворачивается обратно — тогда каждый кадр, даже в экономном режиме
    let hand = false;
    items.forEach(it => { if (!it.grab && (it.ux || it.uy)){ const f = Math.exp(-dt / .35); it.ux *= f; it.uy *= f; if (Math.abs(it.ux) + Math.abs(it.uy) < .003) it.ux = it.uy = 0; } if (it.grab || it.ux || it.uy) hand = true; });
    if (document.hidden || !items.size || (S.lite && !hand)) return;
    if (!hand && now - last < 32) return;        // 30 к/с хватает для медленного поворота — вдвое меньше работы
    last = now;
    const t = now / 1000;
    items.forEach(it => {
      if (!it.t.isConnected){ items.delete(it); return; }
      if (it.dr && !it.dr.classList.contains('open')) return;          // карточки в закрытой шторке не крутим
      // у каждой карточки свой сдвиг фазы — крутятся не синхронно; очень медленно (период ~9–12 с)
      const au = S.lite ? 0 : 1;                                       // в экономном режиме сама не крутится, только пальцем
      const x = Math.sin(t * .62 + it.o) * .75 * au + it.ux, y = Math.cos(t * .5 + it.o * 1.3) * .55 * au + it.uy, k = it.k;
      it.t.style.transform = `perspective(420px) rotateX(${(-y * 16 * k).toFixed(2)}deg) rotateY(${(x * 20 * k).toFixed(2)}deg)`;
      if (it.img) it.img.style.transform = `translate3d(${(x * 7 * k).toFixed(2)}px,${(y * 6 * k).toFixed(2)}px,0) scale(1.05)`;
      if (it.pat) it.pat.style.transform = `translate3d(${(-x * 4 * k).toFixed(2)}px,${(-y * 3 * k).toFixed(2)}px,0)`;
      // блик — мягкое пятно света, едет навстречу повороту (только transform, без перерисовки)
      if (it.gl) it.gl.style.transform = `translate3d(${(-x * 20).toFixed(1)}%,${(-7 - y * 15).toFixed(1)}%,0)`;
    });
  }
  requestAnimationFrame(frame);
  /* повернуть пальцем: тянешь — карточка следует, отпустил — плавно возвращается. Тап без сдвига — onTap */
  function grab(t, onTap){
    const it = [...items].find(i => i.t === t); if (!it) return;
    const cl = v => Math.max(-1.6, Math.min(1.6, v));
    let pid = null, x0 = 0, y0 = 0, u0 = 0, v0 = 0, moved = false;
    t.addEventListener('pointerdown', e => { pid = e.pointerId; x0 = e.clientX; y0 = e.clientY; u0 = it.ux; v0 = it.uy; moved = false; it.grab = true; try { t.setPointerCapture(pid); } catch(_){} });
    t.addEventListener('pointermove', e => { if (e.pointerId !== pid) return; const dx = (e.clientX - x0) / K, dy = (e.clientY - y0) / K;
      if (Math.abs(dx) + Math.abs(dy) > 6) moved = true; it.ux = cl(u0 + dx / 110); it.uy = cl(v0 + dy / 110); });
    const up = e => { if (e.pointerId !== pid) return; pid = null; it.grab = false; if (!moved && e.type === 'pointerup') onTap?.(); };
    t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up);
  }
  return { add(t, img, gl, k = 1, pat = null){ if (t) items.add({ t, img, gl, k, pat, o: (ph += 1.7), dr: t.closest('.drawer'), ux: 0, uy: 0, grab: false }); }, drop(root){ items.forEach(it => { if (root.contains(it.t)) items.delete(it); }); }, grab };
})();

/* =========================================================
   КРАФТ
   ========================================================= */
/* заглушка: удар молота, вспышка цветом тира, тост. Настоящий крафт подключится сюда */
/* ---------- Provably Fair: протокол pawn-pf-v1 (как в бэкенде и на сайте проверки) ----------
   До игры показываем commitment = SHA-256 от 32 байт server seed. Ролл: HMAC-SHA256(зерно, JSON ["pawn-pf-v1", эпоха, домен, client seed, nonce, блок]),
   восемь 32-битных чисел big-endian, первое < 4 294 900 000 → mod 100 000; не подошло ни одно — следующий блок.
   В прототипе каждая игра — своя эпоха: зерно раскрывается сразу после игры, и тут же загадывается следующее */
const PF_VER = 'pawn-pf-v1';
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const enc = t => new TextEncoder().encode(t);
const unhex = h => Uint8Array.from(h.match(/../g).map(x => parseInt(x, 16)));
const sha = async b => hex(await crypto.subtle.digest('SHA-256', b));
const uuid = () => { if (crypto.randomUUID) return crypto.randomUUID(); const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = b[6] & 15 | 64; b[8] = b[8] & 63 | 128; const h = hex(b); return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`; };
const nano = v => BigInt(Math.round(v * 100)) * 10000000n;          // суммы в прототипе — с точностью до сотых
S.clientSeed = 'gk-' + hex(crypto.getRandomValues(new Uint8Array(4)));
S.nonce = 0;
async function rollOf(seed, epoch, domain, clientSeed, nonce){
  const key = await crypto.subtle.importKey('raw', unhex(seed), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  for (let block = 0; ; block++){
    const dv = new DataView(await crypto.subtle.sign('HMAC', key, enc(JSON.stringify([PF_VER, epoch, domain, clientSeed, String(nonce), String(block)]))));
    for (let i = 0; i < 8; i++){ const w = dv.getUint32(i * 4, false); if (w < 4294900000) return { roll: w % TICKETS, block }; }
  }
}
async function newEpoch(){ const seed = hex(crypto.getRandomValues(new Uint8Array(32))); return { id: uuid(), seed, commitment: await sha(unhex(seed)) }; }
let nextEpoch = newEpoch();                                    // зерно следующей игры: его хеш виден до игры
async function takeEpoch(){ const e = await nextEpoch; nextEpoch = newEpoch(); return e; }
const proofBase = (ep, nonce, domain, block, roll) => ({ version: PF_VER, reference: String(nonce), request_id: uuid(), epoch_id: ep.id, commitment: ep.commitment,
  client_seed: S.clientSeed, server_seed: ep.seed, nonce: String(nonce), domain, block_counter: String(block), roll });
/* подтверждение хеша до игры — его сверяет сайт проверки */
async function receiptNow(){ const e = await nextEpoch; return { version: PF_VER, reference: String(S.nonce + 1), epoch_id: e.id, commitment: e.commitment, client_seed: S.clientSeed }; }
/* проверка доказательства прямо в приложении — тот же алгоритм, что в fair-verify.js */
async function checkProof(p){
  const hashOk = await sha(unhex(p.server_seed)) === p.commitment;
  const { roll, block } = await rollOf(p.server_seed, p.epoch_id, p.domain, p.client_seed, p.nonce);
  const ticketOk = hashOk && roll === p.roll && String(block) === p.block_counter;
  let rule = await sha(enc(JSON.stringify(p.rules))) === p.rules_hash;
  if (p.domain === 'craft'){
    const ppm = craftPpm(p.rules, p.roll), sg = p.rules.segments.find(x => p.roll >= x.start && p.roll <= x.end), pay = BigInt(p.inputs.bet_nano) * ppm / BigInt(p.rules.multiplier_scale);
    rule = rule && p.result.zone === sg.zone && BigInt(p.result.multiplier_ppm) === ppm && BigInt(p.result.payout_nano) === pay && BigInt(p.result.ton_payout_nano) + BigInt(p.result.gift_payout_value_nano) === pay;
  } else { let tot = 0; const rw = p.rules.rewards.find(x => (tot += x.weight) > p.roll); rule = rule && rw.kind === p.result.kind && rw.amount === p.result.amount; }
  return { hash: hashOk, ticket: ticketOk, rule: ticketOk && rule };
}
/* ---------- дебаг: выбрать исход следующего крафта ---------- */
S.dbg = { tier: -1, near: false, keep: false, prevDelay: null, freeCases: false, ticket: null, fail: null };
function dbgWant(){
  const d = S.dbg; if (d.tier < 0 || d.ticket != null) return null;
  const t = TIERS[d.tier];
  if (d.near && TIERS[d.tier + 1]){ const m = Math.max(150, Math.floor((t.to - t.from + 1) * .04)); return n => n > t.to - m && n <= t.to; }   // «не хватило совсем чуть-чуть»
  return n => n >= t.from && n <= t.to;
}
const dbgLabel = () => S.dbg.ticket != null ? `тикет ${S.dbg.ticket}` : S.dbg.tier < 0 ? 'выкл' : TIERS[S.dbg.tier].name + (S.dbg.near ? ' · у порога' : '') + (S.dbg.keep ? ' · всегда' : '');
function renderDbg(){
  const d = S.dbg, last = TIERS.length - 1;
  const chip = (k, v, label, c, dis) => `<button class="dbg-c${d[k] === v ? ' on' : ''}" data-k="${k}" data-v="${v}" style="--c:${c || '#fff'}"${dis ? ' disabled' : ''}>${label}</button>`;
