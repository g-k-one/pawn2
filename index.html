<body>
<div class="stage" id="stage">
  <div class="scene" id="scene">

  <!-- лента лайв -->
  <div class="abs sheet">
    <div class="abs live-tag"><span class="up" data-t>лайв</span></div>
    <div class="abs live"><div class="live-row" id="live"></div></div>
  </div>

  <!-- панель крафта -->
  <div class="abs panel" id="panel">
    <canvas id="glow"></canvas>
    <div class="abs tiers" id="tiers"></div>
    <div class="abs range" id="range">x0.4 — x0.8</div>
  </div>

  <div class="abs chance" id="chance"><small data-t>шанс</small><b id="chanceVal">27%</b></div>

  <!-- приз -->
  <div class="abs prize empty" id="prize">???</div>
  <div class="abs drops" id="drops"></div>
  <!-- гифты, которые кладутся в крафт -->
  <div class="abs" id="slots" style="inset:0;pointer-events:none"></div>

  <!-- ставка -->
  <div class="abs bet" id="bet"></div>

  <!-- нижняя панель -->
  <div class="abs bar">
    <button class="round" id="giftBtn" aria-label="Добавить гифты"><img id="giftIco" src="assets/gift-add.svg" alt=""><span class="cnt" id="giftCnt" hidden></span></button>
    <div class="chips">
      <button class="pill trash" id="trash" aria-label="Сбросить ставку"><img src="assets/trash.svg" width="21" height="24" alt=""></button>
      <button class="pill" data-add="0.1"><b>+0.1</b></button>
      <button class="pill" data-add="0.5"><b>+0.5</b></button>
      <button class="pill" data-add="1"><b>+1</b></button>
      <button class="pill" data-add="5"><b>+5</b></button>
    </div>
    <button class="round" id="menuBtn" aria-label="Меню"><svg class="menu-ico" viewBox="0 0 20 16" aria-hidden="true"><path d="M2 2h16M2 8h16M2 14h16" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></button>
  </div>

  <!-- крафт -->
  <button class="abs craft" id="craft" aria-label="Скрафтить">
    <span class="cb" id="cb">
      <img class="orb" src="assets/orb.webp" alt="">
      <span class="core"></span>
      <img class="anvil" id="anvil" src="assets/anvil.svg" alt="">
      <span class="hammer" id="hammer"><img src="assets/hammer.svg" alt=""></span>
      <span class="glint"></span>
    </span>
  </button>


  <div class="abs flash" id="flash"></div>


  </div>

  <!-- экран крафта -->
  <section class="fx" id="fx" aria-live="polite">
    <canvas id="fxGlow"></canvas>
    <div class="fx-in" id="fxIn">
      <div class="fx-top" id="fxTop">
      <div class="digits" id="digits"><span><u class="win"><i></i></u></span><span><u class="win"><i></i></u></span><span><u class="win"><i></i></u></span><span><u class="win"><i></i></u></span><span><u class="win"><i></i></u></span></div>
      <div class="fx-tier" id="fxTier">&nbsp;</div>
      <div class="ladder" id="ladder"></div>
      <div class="fx-need" id="fxNeed"></div>
      <div class="fx-pvp" id="fxPvp"></div>
      </div>
      <div class="fx-case" id="fxCase"><div class="fxc-art" id="fxCaseArt"></div><h4 id="fxCaseT"></h4><div class="croul"><div class="rstrip" id="fxStrip"></div><i class="mline"></i></div><p id="fxCaseS"></p></div>
      <div class="fx-drop" id="fxDrop"></div>
      <div class="fx-win" id="fxWin"></div>
      <div class="fx-btns" id="fxBtns"></div>
      <div class="fx-arena" id="fxArena"></div>
      <div class="fx-bets" id="fxBets"></div>
    </div>
  </section>

    <div class="fx-intro" id="fxIntro" aria-hidden="true"><img class="fi-orb" src="assets/orb.webp" alt=""><span class="fi-heat"></span><span class="fi-ring"></span><img class="fi-a" src="assets/anvil.svg" alt=""><span class="fi-h"><img src="assets/hammer.svg" alt=""></span></div>
  <!-- шторки -->
  <div class="backdrop" id="backdrop"></div>
  <section class="drawer" id="giftsDrawer" aria-label="Подарки">
    <div class="dr-h"><h3 data-t>Подарки <small id="selCnt"></small></h3><p class="dr-sub" id="selHint"></p></div>
    <div class="dr-b"><div class="inv" id="inv"></div></div>
    <div class="dr-f three" id="giftsF"></div>
  </section>
  <section class="drawer" id="pfDrawer" aria-label="Проверка честности">
    <div class="dr-h"><h3 data-t>Честность</h3></div>
    <div class="dr-b" id="pfBody"></div>
  </section>
  <section class="drawer" id="dbgDrawer" aria-label="Дебаг">
    <div class="dr-h"><h3 data-t>Дебаг</h3></div>
    <div class="dr-b" id="dbgBody"></div>
    <div class="dr-f"><button class="btn-main" id="dbgDone" data-t>Готово</button></div>
  </section>
  <section class="drawer tall" id="histDrawer" aria-label="История"><div class="dr-h"><div class="tabs scroll" id="histTabs"></div></div><div class="dr-b" id="histBody"></div></section>
  <section class="drawer ardr" id="arRulesDrawer" aria-label="Правила арены"><div class="dr-h"><h3 data-t>Правила арены</h3></div><div class="dr-b" id="arRulesBody"></div></section>
  <section class="drawer tall" id="pfiDrawer" aria-label="Честность"><div class="dr-h"><h3 data-t>Честность</h3></div><div class="dr-b" id="pfiBody"></div></section>
  <section class="drawer" id="walletDrawer" aria-label="Кошелёк"><div class="dr-h"><div class="tabs" id="walletTabs"></div></div><div class="dr-b" id="walletBody"></div><div class="dr-f"><button class="btn-main" id="walletGo"></button></div></section>
  <section class="drawer tall" id="casesDrawer" aria-label="Бонусы"><div class="dr-h"><div class="tabs scroll" id="casesTabs"></div></div><div class="dr-b" id="casesBody"></div></section>
  <section class="drawer tall" id="caseDrawer" aria-label="Кейс"><div class="dr-h bare"></div><div class="dr-b" id="caseBody"></div><div class="dr-f"><button class="btn-main" id="caseGo"></button></div></section>
  <section class="drawer tall" id="menuDrawer" aria-label="Меню">
    <div class="dr-h bare"></div>
    <div class="dr-b" id="menuBody"></div>
  </section>

  <!-- баланс -->
  <div class="abs balance cx">
    <img class="ava" src="assets/avatar.webp" alt="">
    <div class="pill"><span class="demo-tag" data-t>демо</span><img id="balIco" src="assets/gem-balance.svg" width="23" height="20" alt=""><b id="bal">345.56</b><button class="bal-add" id="balAdd" aria-label="Пополнить"></button></div>
  </div>
  <div class="modal" id="modal"><div class="mbox" id="modalBox"></div></div>
  <!-- уведомления -->
  <div class="notes" id="notes" aria-live="polite"></div>
</div>

<div id="boot"><div class="boot-in"><img src="assets/logo.svg" alt="Pawn"><b>Загружаем подарки</b><i><u id="bootBar"></u></i></div></div>

(()=>{const la=(()=>{try{return localStorage.getItem("bm-lang")==="en"?"en":"ru"}catch{return"ru"}})(),fs={"Внизу — режимы. На Арене до 6 игроков загадывают тикет колесом: кто ближе всех к выпавшему — крафтит на весь банк.":"Modes are at the bottom. In the Arena up to 6 players pick a ticket with the wheel: whoever is closest to the drawn one crafts the whole pot.","Дождись боя — после него можно в другой режим":"Wait for the battle — then you can switch modes","Ключ комнаты + отпечаток тикетов всех игроков (в порядке входа) по открытой формуле дают тикет {0}. Тикеты зафиксированы до розыгрыша — подогнать его ни под кого нельзя.":"The room key + the fingerprint of all players' tickets (in join order) give ticket {0} by the open formula. Tickets are locked before the draw — it can't be rigged for anyone.","Ставка на ранг — кнопками внизу, на чёт и цифру — тапом по полю":"Bet on the rank with the buttons below, on even/odd and digit — tap the board","Кнопками внизу — на ранг, тапом по полю — на чёт и цифру":"Buttons below — on the rank, tap the board — on even/odd and digit","Чёт / нечет":"Even / odd","Даст до":"Pays up to","Возьми фишку меньше или другой исход":"Pick a smaller chip or another outcome","Поставил на тикет в Pawn":"Placed bets on a ticket in Pawn",Финансы:"Finance","Комиссия за вывод":"Withdrawal fee","Ставка не прошла":"The bet didn't go through","Честность в каждом режиме":"Fairness in every mode","Тикет — от зерна эпохи и твоего ключа. Ранг и множитель — по диапазону тикета.":"The ticket comes from the epoch seed and your key. Rank and multiplier follow the ticket range.","У комнаты своё зерно, хеш виден до взносов. Тикет считается от зерна и списка всех тикетов игроков — подогнать его нельзя.":"Each room has its own seed, its hash is shown before entries. The ticket is computed from the seed and the list of all players' tickets — it can't be rigged.","Тикет — от зерна эпохи и твоего ключа, как в крафте. Каждая ставка сыграла или нет по правилу своего вида.":"The ticket comes from the epoch seed and your key, as in crafts. Each bet wins or not by the rule of its type.","Тикет — от зерна эпохи. Предмет — по диапазонам шансов кейса, они открыты в описании.":"The ticket comes from the epoch seed. The item follows the case's chance ranges, shown in its description.","День недели":"Week day","Выиграно в играх":"Won in games",Боёв:"Battles",Побед:"Wins",Взносы:"Entries",Ставок:"Bets",Сбылось:"Came true",Ставки:"Bets","Эксперименты: ставки":"Experiments: bets",Игры:"Games","Ставок пока нет":"No bets yet","Активность друзей":"Friends' activity","Депозит друга":"Friend's deposit","первый депозит":"first deposit","Ставки — только на GRAM":"Bets are GRAM only","Правила ставок":"Bet rules","Загадай тикет":"Pick a ticket","Крути колесо — от 00000 до 99999. Один тикет — один игрок.":"Spin the wheel — from 00000 to 99999. One ticket per player.","Зайди в комнату":"Join the room","Взнос у всех одинаковый. Таймер 30 секунд идёт с первого игрока.":"Everyone pays the same entry. The 30-second timer starts with the first player.","Ближе всех — крафтит банк":"Closest crafts the pot","Весь банк уходит в крафт с выпавшим тикетом, множитель — по его рангу. Один в комнате — крафт твой.":"The whole pot is crafted with the drawn ticket, the multiplier follows its rank. Alone in the room — the craft is yours.","Ничья — пополам":"Tie — split in half","Двое одинаково близко, выше и ниже тикета: каждый крафтит свою половину.":"Two equally close, above and below the ticket: each crafts their half.","За 5 секунд — стоп":"5 seconds — stop","Тикеты фиксируются, войти или сменить тикет уже нельзя.":"Tickets lock — you can't join or change your ticket anymore.","Хеш зерна комнаты известен до взносов. После старта зерно раскроется — исход можно проверить.":"The room seed hash is known before entries. After the start the seed is revealed — the outcome can be verified.",Взнос:"Entry",Дальше:"Next",Игроки:"Players","Крути колесо и угадай тикет — самый et your prize. Every outcome can be verified after the game. Want to try risk-free first?","Играть на GRAM":"Play for GRAM","На фантиках":"Try with candies","1 из 100 000":"1 in 100,000","5% от активности":"5% of activity","5% от активности сами зачисляются на баланс каждый день в 00:00 МСК — забирать вручную не нужно.":"5% of activity is credited automatically every day at 00:00 MSK — no need to claim it.","Client seed — твой ключ":"Client seed — your key","Commitment · игр в эпохе:":"Commitment · games in epoch:","Commitment — SHA-256 зерна, показан до игры":"Commitment — SHA-256 of the seed, shown before the game","GRAM в ставке уменьшены":"GRAM in the bet reduced","GRAM вернулись на баланс":"GRAM returned to the balance","NFT выведено":"NFTs withdrawn","NFT забран":"NFT taken","NFT на главной при смене ставки":"NFT on the main screen when the bet changes","NFT на плитке — для примера":"The NFT on the tile is just an example","NFT продан":"NFT sold","Nonce · домен · блок":"Nonce · domain · block","SHA-256(server seed) должен совпасть с отпечатком, показанным до игры":"SHA-256(server seed) must match the fingerprint shown before the game","Server seed — секретное зерно сервера":"Server seed — the secret server seed","Super Drop забирает тот, кто первым выбьет загаданный тикет.":"The Super Drop goes to whoever hits the target ticket first.","TON Connect не загрузился":"TON Connect failed to load","XP · максимум":"XP · max","XP дают за задания, достижения и в кейсах.":"XP comes from tasks, achievements and cases.","Адрес для пополнений не задан":"Deposit address is not set","Активность — это разница пополнений друга (GRAM и NFT) и выведенного.":"Activity is the difference between a friend's top-ups (GRAM and NFT) and withdrawals.",База:"Base",Базы:"Base",Барон:"Baron","Без свечения и анимаций, крафт сразу показывает итог":"No glow or animations, craft shows the result instantly","Без сообщения релееру вывод не пройдёт. NFT остались у тебя, комиссия не списана":"Withdrawals don't go through without a message to the relayer. Your NFTs stay with you and no fee was charged","Без условий":"No conditions","Белая черта — честный шанс ранга. Чем больше крафтов, тем ближе к ней твои доли.":"The white line is the fair chance of each rank. The more you craft, the closer your shares get to it.",Бесплатно:"Free",Бист:"Beast","Бонус за друзей":"Referral bonus","Бонус с первого депозита друга — 10%, максимум 0.5 GRAM за каждого.":"Bonus from a friend's first deposit — 10%, up to 0.5 GRAM per friend.",Бонусы:"Bonuses","Быстрый крафт":"Fast craft","В Telegram откроется бот партнёра":"The partner bot will open in Telegram","В демо баланс бесконечный":"Balance is unlimited in demo","В демо не разыгрывается":"Not played in demo","В крафте":"In craft","В расчёте участвует и твой ключ. Его можно сменить в любой момент — поэтому мы не можем заранее подобрать результат под тебя.":"Your key is part of the calculation. You can change it any time, so we can't tailor the result to you in advance.","В реальном режиме он был бы твоим":"In real mode it would be yours",ВС:"SU",ВТ:"TU",Вернуться:"Back",Вибрация:"Vibration","Включить экономный режим без анимаций?":"Turn on lite mode without animations?","Восстановление дня":"Day restore","Все награды из кейсов — GRAM, XP и NFT — зачисляются сразу.":"All case rewards — GRAM, XP and NFT — are credited instantly.","Вставь JSON на сайте проверки":"Paste the JSON on the verification site","Вся история":"Full history","Всё честно ✓":"All fair ✓","Выбей его первым в крафте — и NFT твой":"Hit it first in a craft and the NFT is yours","Выбери подарки":"Pick gifts","Выбери подарки для вывода":"Pick gifts to withdraw","Выбить супер дроп · тикет":"Hit super drop · ticket",Вывести:"Withdraw","Вывести NFT":"Withdraw NFT","Вывод NFT":"Withdraw NFT","Вывод NFT не прошёл":"NFT withdrawal failed","Вывод: не написал релееру":"Withdraw: no relayer message",Выиграно:"Won",Выигрыш:"Win",Выключен:"Off","Выключи демо в меню":"Turn of
