<body>
<div class="stage" id="stage">
  <div class="scene" id="scene">

  <!-- лента лайв -->
  <div class="abs sheet">
    <div class="abs live-tag"><span class="up" data-t>лайв</span></div>
    <div class="abs live"><div class="live-row" id="live"></div></div>
  </div>

  <!-- панель крафта -->
  <div class="abs panel" id="panel">
    <canvas id="glow"></canvas>
    <div class="abs tiers" id="tiers"></div>
    <div class="abs range" id="range">x0.4 — x0.8</div>
  </div>

  <div class="abs chance" id="chance"><small data-t>шанс</small><b id="chanceVal">27%</b></div>

  <!-- приз -->
  <div class="abs prize empty" id="prize">???</div>
  <div class="abs drops" id="drops"></div>
  <!-- гифты, которые кладутся в крафт -->
  <div class="abs" id="slots" style="inset:0;pointer-events:none"></div>

  <!-- ставка -->
  <div class="abs bet" id="bet"></div>

  <!-- нижняя панель -->
  <div class="abs bar">
    <button class="round" id="giftBtn" aria-label="Добавить гифты"><img id="giftIco" src="assets/gift-add.svg" alt=""><span class="cnt" id="giftCnt" hidden></span></button>
    <div class="chips">
      <button class="pill trash" id="trash" aria-label="Сбросить ставку"><img src="assets/trash.svg" width="21" height="24" alt=""></button>
      <button class="pill" data-add="0.1"><b>+0.1</b></button>
      <button class="pill" data-add="0.5"><b>+0.5</b></button>
      <button class="pill" data-add="1"><b>+1</b></button>
      <button class="pill" data-add="5"><b>+5</b></button>
    </div>
    <button class="round" id="menuBtn" aria-label="Меню"><svg class="menu-ico" viewBox="0 0 20 16" aria-hidden="true"><path d="M2 2h16M2 8h16M2 14h16" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></button>
  </div>

  <!-- крафт -->
  <button class="abs craft" id="craft" aria-label="Скрафтить">
    <span class="cb" id="cb">
      <img class="orb" src="assets/orb.webp" alt="">
      <span class="core"></span>
      <img class="anvil" id="anvil" src="assets/anvil.svg" alt="">
      <span class="hammer" id="hammer"><img src="assets/hammer.svg" alt=""></span>
      <span class="glint"></span>
    </span>
  </button>


  <div class="abs flash" id="flash"></div>


  </div>

  <!-- экран крафта -->
  <section class="fx" id="fx" aria-live="polite">
    <canvas id="fxGlow"></canvas>
    <div class="fx-in" id="fxIn">
      <div class="fx-top" id="fxTop">
      <div class="digits" id="digits"><span><u class="win"><i></i></u></span><span><u class="win"><i></i></u></span><span><u class="win"><i></i></u></span><span><u class="win"><i></i></u></span><span><u class="win"><i></i></u></span></div>
      <div class="fx-tier" id="fxTier">&nbsp;</div>
      <div class="ladder" id="ladder"></div>
      <div class="fx-need" id="fxNeed"></div>
      <div class="fx-pvp" id="fxPvp"></div>
      </div>
      <div class="fx-case" id="fxCase"><div class="fxc-art" id="fxCaseArt"></div><h4 id="fxCaseT"></h4><div class="croul"><div class="rstrip" id="fxStrip"></div><i class="mline"></i></div><p id="fxCaseS"></p></div>
      <div class="fx-drop" id="fxDrop"></div>
      <div class="fx-win" id="fxWin"></div>
      <div class="fx-btns" id="fxBtns"></div>
      <div class="fx-arena" id="fxArena"></div>
      <div class="fx-bets" id="fxBets"></div>
    </div>
  </section>

    <div class="fx-intro" id="fxIntro" aria-hidden="true"><img class="fi-orb" src="assets/orb.webp" alt=""><span class="fi-heat"></span><span class="fi-ring"></span><img class="fi-a" src="assets/anvil.svg" alt=""><span class="fi-h"><img src="assets/hammer.svg" alt=""></span></div>
  <!-- шторки -->
  <div class="backdrop" id="backdrop"></div>
  <section class="drawer" id="giftsDrawer" aria-label="Подарки">
    <div class="dr-h"><h3 data-t>Подарки <small id="selCnt"></small></h3><p class="dr-sub" id="selHint"></p></div>
    <div class="dr-b"><div class="inv" id="inv"></div></div>
    <div class="dr-f three" id="giftsF"></div>
  </section>

ds' activity","Депозит друга":"Friend's deposit","первый депозит":"first deposit","Ставки — только на GRAM":"Bets are GRAM only","Правила ставок":"Bet rules","Загадай тикет":"Pick a ticket","Крути колесо — от 00000 до 99999. Один тикет — один игрок.":"Spin the wheel — from 00000 to 99999. One ticket per player.","Зайди в комнату":"Join the room","Взнос у всех одинаковый. Таймер 30 секунд идёт с первого игрока.":"Everyone pays the same entry. The 30-second timer starts with the first player.","Ближе всех — крафтит банк":"Closest crafts the pot","Весь банк уходит в крафт с выпавшим тикетом, множитель — по его рангу. Один в комнате — крафт твой.":"The whole pot is crafted with the drawn ticket, the multiplier follows its rank. Alone in the room — the craft is yours.","Ничья — пополам":"Tie — split in half","Двое одинаково близко, выше и ниже тикета: каждый крафтит свою половину.":"Two equally close, above and below the ticket: each crafts their half.","За 5 секунд — стоп":"5 seconds — stop","Тикеты фиксируются, войти или сменить тикет уже нельзя.":"Tickets lock — you can't join or change your ticket anymore.","Хеш зерна комнаты известен до взносов. После старта зерно раскроется — исход можно проверить.":"The room seed hash is known before entries. After the start the seed is revealed — the outcome can be verified.",Взнос:"Entry",Дальше:"Next","Крути колесо и угадай тикет — самый близкий крафтит на весь банк":"Spin the wheel and guess the ticket — the closest crafts the whole pot",ничья:"tie","Арена — только на GRAM":"Arena is GRAM only","Боёв на арене пока нет":"No arena battles yet","Ты на арене":"You're in the arena","Все слоты заняты":"All slots taken","Арена заполнена":"The arena is full","Следующая откроется сразу после старта":"The next one opens right after the start",Арена:"Arena","Общий банк":"Total pot",Ты:"You",Случайный:"Random","Этот тикет уже занят":"This ticket is taken",сдвиг:"offset",Диагностика:"Diagnostics",Сборка:"Build",сцена:"stage","Восстановлени FT taken","NFT на главной при смене ставки":"NFT on the main screen when the bet changes","NFT на плитке — для примера":"The NFT on the tile is just an example","NFT продан":"NFT sold","Nonce · домен · блок":"Nonce · domain · block","SHA-256(server seed) должен совпасть с отпечатком, показанным до игры":"SHA-256(server seed) must match the fingerprint shown before the game","Server seed — секретное зерно сервера":"Server seed — the secret server seed","Super Drop забирает тот, кто первым выбьет загаданный тикет.":"The Super Drop goes to whoever hits the target ticket first.","TON Connect не загрузился":"TON Connect failed to load","XP · максимум":"XP · max","XP дают за задания, достижения и в кейсах.":"XP comes from tasks, achievements and cases.","Адрес для пополнений не задан":"Deposit address is not set","Активность — это разница пополнений друга (GRAM и NFT) и выведенного.":"Activity is the difference between a friend's top-ups (GRAM and NFT) and withdrawals.",База:"Base",Базы:"Base",Барон:"Baron","Без свечения и анимаций, крафт сразу показывает итог":"No glow or animations, craft shows the result instantly","Без сообщения релееру вывод не пройдёт. NFT остались у тебя, комиссия не списана":"Withdrawals don't go through without a message to the relayer. Your NFTs stay with you and no fee was charged","Без условий":"No conditions","Белая черта — честный шанс ранга. Чем больше крафтов, тем ближе к ней твои доли.":"The white line is the fair chance of each rank. The more you craft, the closer your shares get to it.",Бесплатно:"Free",Бист:"Beast","Бонус за друзей":"Referral bonus","Бонус с первого депозита друга — 10%, максимум 0.5 GRAM за каждого.":"Bonus from a friend's first deposit — 10%, up to 0.5 GRAM per friend.",Бонусы:"Bonuses","Быстрый крафт":"Fast craft","В Telegram откроется бот партнёра":"The partner bot will open in Telegram","В демо баланс бесконечный":"Balance is unlimited in demo","В демо не разыгрывается":"Not played in demo","В крафте":"In craft","
